<!DOCTYPE html>
<html><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Pixelify+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&family=Micro+5&display=swap" rel="stylesheet"/>
<style>
  body{margin:0;background:#080d15;color:#f4b223;font-family:sans-serif;padding:48px 64px;}
  .row{margin-bottom:54px;}
  .lbl{font-family:monospace;color:#6c819a;font-size:13px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px;}
  .amber{color:#f4b223;filter:drop-shadow(0 0 8px rgba(244,178,35,.4));}

  /* 1 DotGothic16 solid */
  .t1{font-family:"DotGothic16";font-size:92px;line-height:.95;text-transform:uppercase;letter-spacing:.02em;}

  /* 2 DotGothic16 with square-dot clip to separate pixels */
  .t2{font-family:"DotGothic16";font-size:92px;line-height:.95;text-transform:uppercase;letter-spacing:.02em;
    color:transparent;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    background-image:repeating-linear-gradient(0deg,#f4b223 0 4px,transparent 4px 6px),repeating-linear-gradient(90deg,#f4b223 0 4px,transparent 4px 6px);
    background-blend-mode:multiply;filter:drop-shadow(0 0 7px rgba(244,178,35,.4));}

  /* 3 Pixelify Sans */
  .t3{font-family:"Pixelify Sans";font-weight:600;font-size:92px;line-height:.95;text-transform:uppercase;letter-spacing:.01em;}

  /* 4 Silkscreen */
  .t4{font-family:"Silkscreen";font-weight:700;font-size:64px;line-height:1.05;text-transform:uppercase;letter-spacing:.02em;}

  /* 5 current technique: round dot clip on Saira */
  @import url('https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@800&display=swap');
  .t5{font-family:"Saira Condensed";font-weight:800;font-size:92px;line-height:.92;text-transform:uppercase;letter-spacing:.02em;
    color:transparent;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    background-image:radial-gradient(circle at 50% 50%, #ffd866 0 1.5px, #f4b223 1.5px 2.5px, rgba(244,178,35,.10) 2.9px, transparent 3.3px);
    background-size:9px 9px;filter:drop-shadow(0 0 8px rgba(244,178,35,.4));}
</style></head>
<body>
  <div class="row"><div class="lbl">1 · DotGothic16 (solid pixels)</div><div class="t1 amber">Milwaukee<br>County Stadium</div></div>
  <div class="row"><div class="lbl">2 · DotGothic16 + square-dot separation mask</div><div class="t2">Milwaukee<br>County Stadium</div></div>
  <div class="row"><div class="lbl">3 · Pixelify Sans</div><div class="t3 amber">Milwaukee<br>County Stadium</div></div>
  <div class="row"><div class="lbl">4 · Silkscreen</div><div class="t4 amber">Milwaukee<br>County Stadium</div></div>
  <div class="row"><div class="lbl">5 · current — round-dot clip on Saira Condensed</div><div class="t5">Milwaukee<br>County Stadium</div></div>
</body></html>
