<!DOCTYPE html><html><head><meta charset="utf-8"><title>Logo audit</title><style>body{margin:0;background:#111}iframe{width:600px;height:400px;border:0;display:block}</style></head><body><script>
window.PAGES=["American Family Field Spread","Anaheim Stadium Spread","Busch Stadium Spread","Chase Field Spread","Citi Field Spread","Citizens Bank Park Spread","Cleveland Municipal Stadium Spread","Comerica Park Spread","Comiskey Park Spread","Coors Field Spread","Dodger Stadium Spread","Fenway Park Spread","Globe Life Field Spread","Great American Ball Park Spread","Marlins Park Spread","Memorial Stadium Spread","Mile High Stadium Spread","Milwaukee County Stadium Spread","Minute Maid Park Spread","Nationals Park Spread","New Comiskey Park Spread","Oracle Park Spread","Oriole Park at Camden Yards Spread","PNC Park Spread","Petco Park Spread","Progressive Field Spread","Riverfront Stadium Spread","Rogers Centre Spread","Royals Stadium Spread","Safeco Field Spread","San Diego Stadium Spread","Shea Stadium Spread","SunTrust Park Spread","Sutter Health Park Spread","Target Field Spread","Three Rivers Stadium Spread","Tiger Stadium Spread","Tropicana Field Spread","Veterans Stadium Spread","Wrigley Field Spread","Yankee Stadium 2009 Spread","Yankee Stadium Spread"];
window.loadBatch=function(list){document.body.innerHTML="";return Promise.all(list.map(function(n){return new Promise(function(res){var f=document.createElement("iframe");f.dataset.name=n;f.src="../"+encodeURIComponent(n)+".html";f.onload=function(){setTimeout(res,1200)};f.onerror=function(){res()};document.body.appendChild(f)})})};
window.measure=function(){var out=[];document.querySelectorAll("iframe").forEach(function(f){var d=f.contentDocument;if(!d)return;var imgs=[].slice.call(d.querySelectorAll("img"));var mlbs=imgs.filter(function(i){return /mlb-logo/i.test(i.getAttribute("src")||"")});var rows=[];mlbs.forEach(function(m){var mr=m.getBoundingClientRect();if(mr.height<1)return;var neigh=imgs.filter(function(i){if(i===m)return false;if(/mlb-logo/i.test(i.getAttribute("src")||""))return false;var r=i.getBoundingClientRect();if(r.height<1)return false;return Math.abs((r.top+r.height/2)-(mr.top+mr.height/2))<120&&Math.abs((r.left+r.width/2)-(mr.left+mr.width/2))<400});neigh.forEach(function(i){var r=i.getBoundingClientRect();rows.push({mlbH:+mr.height.toFixed(1),other:(i.getAttribute("src")||"").split("/").pop(),otherH:+r.height.toFixed(1),ratio:+(mr.height/r.height).toFixed(3)})})});if(rows.length)out.push({page:f.dataset.name,rows:rows})});return out};
</script></body></html>
