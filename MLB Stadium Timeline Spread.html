<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MLB Stadium Timeline — Spread</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  /* Self-hosted single-weight Oswald faces, each aliased at font-weight:normal.
     All Oswald type on this spread is SVG <text>; Chrome's print-to-PDF grabs
     the "Oswald" Regular master and SYNTHESIZES 500/700 for SVG text, embedding
     non-embeddable "Oswald-Regular_Medium/_Bold" (Blurb rejects them). A family
     with exactly one normal-weight face can't be synthesized — Chrome embeds it
     verbatim. Metrics are identical to Google Oswald 500/700, so canvas
     width-measurement (which still uses "Oswald") stays exact. */
  @font-face { font-family: "Oswald Med"; src: url("oswald-med.woff2") format("woff2"); font-weight: normal; font-style: normal; font-display: block; }
  @font-face { font-family: "Oswald Bd";  src: url("oswald-bd.woff2")  format("woff2"); font-weight: normal; font-style: normal; font-display: block; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #11100e;
    font-family: "Spectral", Georgia, serif;
    color: #24201C;
    -webkit-font-smoothing: antialiased;
    text-rendering: geometricPrecision;
  }
  /* ----------------------------------------------------------------
     MLB STADIUM TIMELINE — thematic interstitial
     Blurb Large Landscape 13 x 11 in, two-page spread.
     2550 x 1088 px (25.50 x 10.88 in @ 100ppi). Export 3x = 7650 x 3264 px = 300 DPI.
     Center fold x=1275. A data spread: warm cream paper across both pages.
     ---------------------------------------------------------------- */
  #root { min-height: 100vh; }
  svg text { paint-order: stroke fill; }
</style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#EFE7D6"/>
      <rect x="18" y="34" width="44" height="8" rx="1.5" fill="#6F7B80"/>
      <rect x="18" y="48" width="60" height="8" rx="1.5" fill="#1E6B53"/>
      <rect x="18" y="62" width="36" height="8" rx="1.5" fill="#6F7B80"/>
      <path d="M70 52 L75 57 L70 62 L65 57 Z" fill="#E0A21C" stroke="#7C5510" stroke-width="0.8"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="timeline-data.js"></script>
  <script src="field-labels.js"></script>

  <script type="text/babel" src="print-page.jsx"></script>
  <script type="text/babel" src="timeline-spread.jsx"></script>
  <script type="text/babel" src="timeline-app.jsx"></script>
</body>
</html>
