<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open Print Pages — MLB Book v3</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 36px 64px;
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    background: #f4f1ea; color: #1c1a17; line-height: 1.4;
  }
  .wrap { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 26px; font-weight: 600; margin: 0 0 4px; }
  p.lede { margin: 0 0 20px; font-size: 15px; color: #4a463f; max-width: 60ch; }
  .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 22px; flex-wrap: wrap; }
  button.all {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px;
    color: #f4f1ea; background: #1c1a17; border: 1px solid #1c1a17;
    border-radius: 4px; padding: 10px 18px; cursor: pointer;
  }
  button.all:hover { background: #34302a; }
  .hint { font-size: 12.5px; color: #6a655b; max-width: 44ch; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li { display: flex; align-items: center; gap: 12px; }
  .idx { font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: #9a9486; width: 26px; flex: none; }
  a.page {
    flex: 1 1 auto; display: flex; align-items: center; justify-content: space-between;
    text-decoration: none; color: #1c1a17;
    background: #fffdf8; border: 1px solid #cfc8b8; border-radius: 4px;
    padding: 9px 14px; font-size: 14.5px;
  }
  a.page:hover { background: #1c1a17; color: #f4f1ea; border-color: #1c1a17; }
  a.page .tag {
    font-family: ui-monospace, Menlo, monospace; font-size: 11px;
    color: #6a655b; text-transform: uppercase; letter-spacing: 0.06em;
  }
  a.page:hover .tag { color: #cabfa6; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Open Print Pages</h1>
  <p class="lede">This tab is authorized, so these open cleanly. Click <strong>Open all</strong> (allow popups if Chrome asks), or open any page individually — then <code>Cmd/Ctrl+P</code> → Save as PDF → Margins: None.</p>
  <div class="bar">
    <button type="button" class="all" id="all">Open all 23 ↗</button>
    <span class="hint">Tip: if a burst gets blocked, click the individual rows — a direct click is never blocked.</span>
  </div>
  <ol id="list"></ol>
</div>
<script>
  const pages = [
    ["Front Cover", "page", "01-front-cover-page.html"],
    ["Rogers Centre", "left", "02-rogers-centre-left.html"],
    ["Rogers Centre", "right", "03-rogers-centre-right.html"],
    ["Globe Life Field", "left", "04-globe-life-field-left.html"],
    ["Globe Life Field", "right", "05-globe-life-field-right.html"],
    ["Yankee Stadium 2009", "left", "06-yankee-stadium-2009-left.html"],
    ["Yankee Stadium 2009", "right", "07-yankee-stadium-2009-right.html"],
    ["Fenway Park", "left", "08-fenway-park-left.html"],
    ["Fenway Park", "right", "09-fenway-park-right.html"],
    ["Target Field", "left", "10-target-field-left.html"],
    ["Target Field", "right", "11-target-field-right.html"],
    ["Anaheim Stadium", "left", "12-anaheim-stadium-left.html"],
    ["Anaheim Stadium", "right", "13-anaheim-stadium-right.html"],
    ["PNC Park", "left", "14-pnc-park-left.html"],
    ["PNC Park", "right", "15-pnc-park-right.html"],
    ["Ballpark & City 1", "left", "16-ballpark-city-1-left.html"],
    ["Ballpark & City 1", "right", "17-ballpark-city-1-right.html"],
    ["Ballpark & City 2", "left", "18-ballpark-city-2-left.html"],
    ["Ballpark & City 2", "right", "19-ballpark-city-2-right.html"],
    ["MLB Stadium Timeline", "left", "20-mlb-stadium-timeline-left.html"],
    ["MLB Stadium Timeline", "right", "21-mlb-stadium-timeline-right.html"],
    ["All Trip Games", "page", "22-all-trip-games-page.html"],
    ["Ballparks Visited", "page", "23-ballparks-visited-page.html"],
  ];
  const list = document.getElementById("list");
  pages.forEach(([name, tag, file], i) => {
    const li = document.createElement("li");
    li.innerHTML =
      `<span class="idx">${String(i + 1).padStart(2, "0")}</span>` +
      `<a class="page" href="${file}" target="_blank" rel="noopener">` +
      `<span>${name}</span><span class="tag">${tag}</span></a>`;
    list.appendChild(li);
  });
  document.getElementById("all").addEventListener("click", () => {
    pages.forEach(([, , file], i) => {
      setTimeout(() => window.open(file, "_blank", "noopener"), i * 300);
    });
  });
</script>
</body>
</html>
