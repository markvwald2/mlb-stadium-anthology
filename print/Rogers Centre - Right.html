<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Print — Rogers Centre (right)</title>
<style>
  html,body{margin:0;height:100%;background:#1c1a17;color:#f4f1ea;
    font-family:ui-monospace,Menlo,monospace;display:flex;align-items:center;justify-content:center}
  p{font-size:14px;letter-spacing:.04em;opacity:.8}
</style>
</head>
<body>
<p>Opening Rogers Centre — right page for print…</p>
<script>
  // Preserve any preview/session token already on this URL, then forward to
  // the spread's single-page print view. Relative nav keeps the same origin.
  (function () {
    var u = new URL(location.href);
    u.searchParams.set("print", "1");
    u.searchParams.set("page", "right");
    location.replace("../Rogers%20Centre%20Spread.html" + u.search);
  })();
</script>
</body>
</html>
