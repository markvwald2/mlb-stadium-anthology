<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Comiskey Park — Spread</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Oswald:wght@300;400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #2b2b2e;
    font-family: "Spectral", Georgia, serif;
    color: #1E1A14;
    -webkit-font-smoothing: antialiased;
  }

  /* =====================================================================
     "THE EXPLODING SCOREBOARD" — Comiskey Park spread.
     The right page is a disassembled black-steel scoreboard machine: photo
     bays, an inning-board line score, scoreboard-panel nameplates, lit-bulb
     accents, and a forest of rivets. The left page is a dark aerial plate
     with a marquee-sign title band. Prefix: .cm-
     ===================================================================== */
  .cm-spread {
    letter-spacing: -0.5px;   /* mirror DesignCanvas .dc-card tracking so print == design */
    position: relative; width: 2550px; height: 1088px; overflow: hidden;
    --steel-0:#100C07; --steel-1:#16120D; --steel-2:#1C1710; --steel-3:#241D13;
    --steel-hi:#4A4029; --steel-edge:#3A3122; --steel-deep:#0A0805;
    --rivet-hi:#6E6447; --rivet-lo:#26201400;
    --silver:#CFC4AC; --silver-2:#9A8F76; --silver-3:#7E7563;
    --paper:#EBE2CD; --paper-2:#E2D7BD; --paper-3:#DED2B6; --paper-edge:#CBBE9F;
    --ink:#211D16; --ink-2:#4A4338; --ink-3:#857B68; --rule:#CFC3A6;
    --bulb:#F0D384; --bulb-2:#E7B86A; --brick:#8A3526; --brick-2:#B7503B;
    background: var(--steel-1); font-family: "Spectral", Georgia, serif; color: var(--ink);
    text-rendering: geometricPrecision; font-kerning: normal;
  }
  .cm-page { position: absolute; top: 0; height: 1088px; }
  .cm-left  { left: 0;     width: 1275px; background: #100D09; overflow: hidden; }
  .cm-right { left: 1275px; width: 1275px; background: var(--steel-1); overflow: hidden; }
  /* center page split — flat hairline only (no fake book depth) */
  .cm-spread::after { content: ""; position: absolute; top: 0; bottom: 0; left: 1275px; width: 1px;
    background: rgba(0,0,0,.4); z-index: 9; pointer-events: none; }

  /* ============ shared bulb / rivet helpers ============ */
  .cm-rivet { width: 9px; height: 9px; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 36% 30%, var(--rivet-hi), #221C12 72%);
    box-shadow: inset 0 0 0 .5px var(--steel-deep), 0 1px 1px rgba(0,0,0,.7); }
  .cm-rivetrow { display: flex; align-items: center; gap: 12px; }
  .cm-bulbs { display: flex; gap: 7px; align-items: center; }
  .cm-bulbs i { width: 5px; height: 5px; border-radius: 50%; background: var(--bulb);
    box-shadow: 0 0 5px var(--bulb-2); display: block; }

  /* =================== LEFT / AERIAL PLATE =================== */
  .cm-hero-slot { position: absolute; inset: 0; z-index: 1; width: 1275px; height: 1088px; }
  .cm-hero-slot image-slot { width: 1275px; height: 1088px; display: block; }
  .cm-hero-scrim { position: absolute; inset: 0; pointer-events: none; z-index: 2;
    background:
      linear-gradient(180deg, rgba(58,102,158,.55) 0%, rgba(74,120,176,.34) 16%, rgba(90,134,186,.16) 30%, rgba(90,134,186,0) 46%); }
  @media print {
    /* Skia print-to-PDF: image-slot <img> transform makes its own composited
       layer that paints over a plain sibling scrim regardless of z-index.
       Composite the slot too so the img layer stays contained below the scrim. */
    .cm-hero-slot  { transform: translateZ(0) !important; }
    .cm-hero-scrim { transform: translateZ(0) !important; }
  }

  /* faint scoreboard-pylon verticals rising over the plate */
  .cm-pylons { position: absolute; inset: 0; z-index: 3; pointer-events: none; opacity: .5; }

  /* stat plate — lit vertical marquee, now bottom-left */
  .cm-statplate { position: absolute; bottom: 52px; left: 58px; z-index: 6;
    background: #110D07; border: 2px solid #04030100; padding: 12px; border-radius: 2px;
    box-shadow: 0 5px 16px rgba(0,0,0,.32), inset 0 0 0 1px #2E2716; }
  /* stat-plate bulbs are also placed by <BulbBorder> (sm variant) */
  .cm-statinner { position: relative; background: linear-gradient(180deg,#1E1810,#140F08);
    border: 1px solid #3A3120; padding: 2px 20px; }
  .cm-stat { padding: 11px 0; border-bottom: 1px solid rgba(160,140,90,.22); }
  .cm-stat:last-child { border-bottom: 0; }
  .cm-stat .k { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 12px;
    letter-spacing: .24em; text-transform: uppercase; color: #9A8F76; }
  .cm-stat .v { font-family: "Saira Condensed", sans-serif; font-weight: 700; font-size: 27px;
    color: #EDE3CC; letter-spacing: .02em; margin-top: 2px; line-height: 1; white-space: nowrap; }

  /* title block now top-left */
  .cm-hero-block { position: absolute; left: 60px; top: 60px; right: 70px; z-index: 6; }
  .cm-eyebrow { display: flex; align-items: center; gap: 13px; margin-bottom: 20px;
    font-family: "Oswald", sans-serif; font-weight: 600; font-size: 13px; letter-spacing: .34em;
    text-transform: uppercase; color: #1A1610; }
  .cm-eyebrow::after { content: ""; height: 1.5px; width: 78px; background: linear-gradient(90deg,#1A1610,transparent); display: block; }

  .cm-title-marquee, .cm-title-marquee * { --gs-x: 1.5px; --gs-y: 2px; }
  .cm-title-marquee { position: relative; display: inline-block; padding: 17px; border-radius: 3px;
    background: #110D07; box-shadow: 0 5px 16px rgba(0,0,0,.32), inset 0 0 0 2px #322a1d, 0 0 0 2px #05040250; }
  /* Bulb border is placed by <BulbBorder> (JS): a lamp on every corner + evenly
     distributed lamps along each edge, measured from the box's live size. */
  .cm-lampwrap { position: absolute; inset: 0; pointer-events: none; }
  .cm-lamp { position: absolute; width: 4px; height: 4px; border-radius: 50%;
    transform: translate(-50%, -50%); background: var(--bulb);
    box-shadow: 0 0 4px var(--bulb-2), 0 0 1px rgba(0,0,0,.55); }
  .cm-lamp.sm { width: 3.4px; height: 3.4px; box-shadow: 0 0 3px var(--bulb-2), 0 0 1px rgba(0,0,0,.55); }
  .cm-title-inner { position: relative; background: linear-gradient(180deg,#EFE6D0,#E0D4B8);
    border: 1px solid #C6B999; padding: 12px 46px 16px;
    box-shadow: inset 0 1px 0 #FBF5E6, inset 0 -3px 8px rgba(120,95,50,.22); }
  .cm-title-text { margin: 0; font-family: "Saira Condensed", sans-serif; font-weight: 800;
    font-size: 100px; line-height: .84; letter-spacing: .004em; text-transform: uppercase;
    color: #1A1610; white-space: nowrap; }
  .cm-loc { display: flex; align-items: center; gap: 14px; margin-top: 22px;
    font-family: "Saira Condensed", sans-serif; font-weight: 600; font-size: 30px; letter-spacing: .14em;
    text-transform: uppercase; color: #1A1610; }
  .cm-loc .star { color: var(--brick-2); font-size: 22px; }

  .cm-hero-foot { display: flex; align-items: center; gap: 22px; margin-top: 26px; }
  .cm-foot-logos { display: flex; gap: 12px; }
  .cm-logo-well { flex: none; display: flex; align-items: center; justify-content: center; }
  .cm-logo-well img { height: 48px; width: auto; display: block; }
  .cm-logo-well img[src*="mlb-logo"] { height: 30.7px; }
  .cm-foot-addr { font-family: "Oswald", sans-serif; font-weight: 400; font-size: 13.5px; letter-spacing: .12em;
    text-transform: uppercase; color: #2A2118; line-height: 1.55; }
  .cm-foot-addr b { color: #1A1610; font-weight: 700; }

  /* =================== RIGHT / SCOREBOARD MACHINE =================== */
  .cm-ghost { position: absolute; inset: 0; z-index: 0; pointer-events: none; opacity: .9; }
  .cm-rp { position: absolute; top: 37.5px; right: 37.5px; bottom: 37.5px; left: 48px; z-index: 2; display: flex; flex-direction: column; padding: 15px;
    background: linear-gradient(180deg,#221B12 0%, #16110A 60%, #120D07 100%);
    border: 3px solid var(--steel-deep);
    box-shadow: inset 0 0 0 2px var(--steel-edge), inset 0 2px 0 var(--steel-hi),
      inset 0 -3px 9px rgba(0,0,0,.6), 0 0 0 1px #000, 0 18px 50px rgba(0,0,0,.4); }
  /* corner rivets on the steel frame */
  .cm-fr { position: absolute; z-index: 5; }
  .cm-fr.tl { top: 8px; left: 8px; } .cm-fr.tr { top: 8px; right: 8px; }
  .cm-fr.bl { bottom: 8px; left: 8px; } .cm-fr.br { bottom: 8px; right: 8px; }

  /* ---- photo bays ---- */
  .cm-photostrip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; flex: none; height: 150px; }
  .cm-photopanel { position: relative; background: #0C0905; border: 2px solid var(--steel-deep); overflow: hidden;
    box-shadow: inset 0 0 0 1px var(--steel-edge); }
  .cm-photopanel image-slot { width: 100%; height: 100%; display: block; }
  .cm-photopanel .bezel { position: absolute; inset: 0; pointer-events: none; z-index: 3;
    box-shadow: inset 0 0 0 1px rgba(74,64,41,.6), inset 0 0 18px rgba(0,0,0,.5); }
  .cm-photopanel .pn { position: absolute; top: 5px; left: 6px; z-index: 4;
    font-family: "Space Mono", monospace; font-weight: 700; font-size: 12px; letter-spacing: .1em;
    color: rgba(240,211,132,.85); text-shadow: 0 1px 2px rgba(0,0,0,.9); }

  /* ---- metadata ribbon (black steel bar) ---- */
  .cm-ribbon { display: grid; grid-template-columns: 1.22fr 1.12fr 1.5fr 1.18fr 1.4fr 1fr; flex: none;
    margin-top: 11px; height: 76px; background: linear-gradient(180deg,#120E08,#070504); border: 2px solid #050301;
    box-shadow: inset 0 1px 0 var(--steel-hi), inset 0 -2px 6px rgba(0,0,0,.75); }
  .cm-ribcell { display: flex; flex-direction: column; justify-content: center; gap: 4px; padding: 0 17px;
    border-left: 1px solid #2A2417; position: relative; min-width: 0; }
  .cm-ribcell:first-child { border-left: 0; }
  .cm-ribcell .k { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 12px;
    letter-spacing: .2em; text-transform: uppercase; color: #8A7F68; }
  .cm-ribcell .v { font-family: "Saira Condensed", sans-serif; font-weight: 700; font-size: 19px;
    color: #ECE2CB; letter-spacing: .02em; line-height: 1.04; }
  .cm-ribcell .v small { display: block; font-family: "Space Mono", monospace; font-weight: 400;
    font-size: 12px; letter-spacing: .02em; color: #9A8F76; margin-top: 2px; }
  .cm-ribcell .v.mono { font-family: "Space Mono", monospace; font-weight: 700; font-size: 13px; }
  .cm-ribcell.logo { flex-direction: row; align-items: center; gap: 11px; }
  .cm-ribcell.logo img { height: 30px; width: auto; flex: none; box-sizing: content-box;
    margin-left: -10px;
    background: #EDE6D3; padding: 5px 7px; border-radius: 3px; border: 1px solid rgba(0,0,0,.25);
    box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .cm-ribcell.logo .stack { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

  /* ---- middle row (three scoreboard panels) ---- */
  .cm-midrow { flex: 1; display: grid; grid-template-columns: 0.8fr 1.05fr 1.5fr; gap: 11px; margin-top: 11px; min-height: 0; }
  .cm-panel { position: relative; display: flex; flex-direction: column; min-height: 0; min-width: 0;
    background: #0C0905; border: 2px solid var(--steel-deep); box-shadow: inset 0 0 0 1px var(--steel-edge); }
  .cm-nameplate { display: flex; align-items: center; gap: 10px; padding: 8px 13px; flex: none;
    background: linear-gradient(180deg,#261E13,#140F08); border-bottom: 2px solid var(--steel-deep);
    box-shadow: inset 0 1px 0 #463c26; }
  .cm-nameplate .t { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 12.5px;
    letter-spacing: .2em; text-transform: uppercase; color: #EADFC7; }
  .cm-nameplate .num { margin-left: auto; font-family: "Space Mono", monospace; font-weight: 700;
    font-size: 12px; letter-spacing: .06em; color: var(--bulb); }
  .cm-pbody { flex: 1; margin: 6px; padding: 11px 14px; min-height: 0; overflow: hidden;
    display: flex; flex-direction: column; background: linear-gradient(180deg,#EBE2CD,#E1D6BC);
    border: 1px solid var(--paper-edge); box-shadow: inset 0 1px 0 #FAF4E5, inset 0 0 24px rgba(120,95,50,.10); }
  /* Spacing must be deterministic between screen (zoom 1) and print (zoom .96):
     `space-between` splits whatever free space is left over, and the leftover
     differs by a pixel or two at print zoom — so the gaps visibly redistribute.
     Instead, keep the natural top-down rhythm and let ALL slack collect in one
     place, above the closing plate, which stays pinned to the panel floor. */
  .cm-pbody.visit { justify-content: flex-start; }
  .cm-pbody.visit > .cm-vgroup:last-child { margin-top: auto; }
  .cm-vgroup { display: flex; flex-direction: column; flex: none; }

  /* facts table */
  .cm-ftable { width: 100%; border-collapse: collapse; height: 100%; }
  .cm-ftable tr { border-bottom: 1px solid var(--rule); }
  .cm-ftable tr:last-child { border-bottom: 0; }
  .cm-ftable th { text-align: left; vertical-align: baseline; width: 86px; padding: 3px 9px 3px 0;
    font-family: "Oswald", sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.6px;
    text-transform: uppercase; color: var(--ink-3); }
  .cm-ftable td { vertical-align: baseline; padding: 3px 0; font-family: "Spectral", serif;
    font-size: 12px; line-height: 1.24; color: var(--ink); }
  .cm-ftable td b { color: var(--brick); font-weight: 600; }

  /* visit panel */
  .cm-vmatch { display: flex; align-items: center; justify-content: center; gap: 14px; flex: none;
    padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
  .cm-vteam { display: flex; align-items: center; gap: 9px; }
  .cm-vteam.away { flex-direction: row-reverse; }
  .cm-vteam img { width: 32px; height: 32px; object-fit: contain; flex: none; }
  .cm-vteam .nm { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 12px;
    letter-spacing: .06em; text-transform: uppercase; color: var(--ink); line-height: 14px; }
  .cm-vat { font-family: "Spectral", serif; font-style: italic; font-size: 13px; color: var(--ink-3); }
  .cm-vdate { text-align: center; font-family: "Saira Condensed", sans-serif; font-weight: 700;
    font-size: 19px; line-height: 23px; letter-spacing: .05em; text-transform: uppercase; color: #1A1610; margin: 9px 0 2px; flex: none; }
  .cm-vvenue { text-align: center; font-family: "Oswald", sans-serif; font-weight: 400; font-size: 12px;
    letter-spacing: .16em; line-height: 18px; text-transform: uppercase; color: var(--ink-3); margin-bottom: 9px; flex: none; }

  /* inning board (dark line score embedded in cream) */
  .cm-board { background: #100C07; border: 2px solid #050301; padding: 6px 7px; flex: none;
    height: 92.5px; box-sizing: border-box;
    box-shadow: inset 0 1px 0 var(--steel-hi), 0 3px 10px rgba(0,0,0,.4); }
  .cm-line { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; }
  /* Print renders at .96 zoom, where glyph-driven line boxes round down and the
     losses accumulate down the panel (the visit column ran ~11 design-px short).
     Pin every text-driven row to an explicit height so its box scales exactly
     with the zoom instead of being measured from rounded font metrics. */
  .cm-line th, .cm-line td { font-family: "Space Mono", monospace; font-size: 12px; text-align: center;
    height: 25px; box-sizing: border-box;
    padding: 3px 0; color: #D8CDB4; border: 1px solid #2E2716; }
  .cm-line thead th { color: #8A7F68; font-weight: 400; background: #1A150D; }
  .cm-line td.tm, .cm-line th.tm { width: 40px; text-align: left; padding-left: 6px; font-weight: 700;
    font-family: "Oswald", sans-serif; letter-spacing: .04em; }
  .cm-line tr.away td.tm { color: #EDE3CC; }
  .cm-line tr.home td.tm { color: var(--bulb); }
  .cm-line td.sep, .cm-line th.sep { border-left: 2px solid #463c26; }
  .cm-line .rhe { font-weight: 700; color: #F0D384; background: #1A150D; }
  .cm-line td.x { color: #6A6047; }

  .cm-vresult { display: flex; align-items: center; justify-content: center; gap: 12px; flex: none;
    height: 34px; box-sizing: border-box;
    margin: 9px 0; padding: 6px 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .cm-vresult .fin { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 12px;
    letter-spacing: .2em; text-transform: uppercase; color: var(--brick); }
  .cm-vresult .txt { font-family: "Saira Condensed", sans-serif; font-weight: 700; font-size: 16px;
    letter-spacing: .02em; text-transform: uppercase; color: #1A1610; }

  .cm-pitch { flex: none; }
  .cm-prow { display: flex; flex-direction: column; gap: 0; margin-bottom: 4px; }
  .cm-prow:last-child { margin-bottom: 0; }
  .cm-prow .k { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 12px; line-height: 17px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); }
  .cm-prow .v { font-family: "Spectral", serif; font-size: 12px; color: var(--ink); line-height: 16px; }
  .cm-prow .v b { color: var(--brick); font-weight: 600; }

  .cm-vdetails { padding-top: 6px; }
  .cm-vrow { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    height: 24px; box-sizing: border-box;
    padding: 2px 0; border-bottom: 1px dotted var(--rule); }
  .cm-vrow:last-child { border-bottom: 0; }
  .cm-vrow .k { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 12px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
  .cm-vrow .v { font-family: "Space Mono", monospace; font-weight: 700; font-size: 12px; color: var(--ink); text-align: right; }

  /* first-visit memory plate — stylized lit scoreboard year */
  .cm-firstvisit { margin-top: 7px; margin-bottom: 3px; display: flex; align-items: center; gap: 12px; padding: 8px 13px;
    background: linear-gradient(180deg,#17120B,#0C0905); border: 2px solid #050301;
    box-shadow: inset 0 1px 0 var(--steel-hi), 0 3px 9px rgba(0,0,0,.4); }
  .cm-firstvisit .lbl { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }
  .cm-firstvisit .lbl .k { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 12px;
    letter-spacing: .2em; text-transform: uppercase; color: #C7BCA3; white-space: nowrap; }
  .cm-firstvisit .lbl .sub { font-family: "Spectral", serif; font-style: italic; font-size: 12px; color: #9A8F76; white-space: nowrap; }
  .cm-firstvisit .yr { margin-left: auto; padding-left: 10px; flex: none; font-family: "Saira Condensed", sans-serif; font-weight: 800;
    font-size: 36px; line-height: .88; letter-spacing: .02em; color: var(--bulb); }

  /* historical context — scoreboard inning bays */
  .cm-context { display: flex; flex-direction: column; justify-content: space-evenly; flex: 1; min-height: 0; }
  .cm-bay { display: flex; gap: 11px; padding: 7px 0; border-bottom: 1px solid var(--rule); flex: none; min-height: 0; }
  .cm-bay:first-child { padding-top: 1px; } .cm-bay:last-child { border-bottom: 0; padding-bottom: 0; }
  .cm-bay .chip { flex: none; width: 27px; height: 29px; background: #100C07; border: 1px solid #050301;
    display: flex; align-items: center; justify-content: center; box-shadow: inset 0 0 0 1px var(--steel-edge); }
  .cm-bay .chip span { font-family: "Saira Condensed", sans-serif; font-weight: 800; font-size: 19px; color: var(--bulb); }
  .cm-bay p { margin: 0; font-family: "Spectral", serif; font-size: 12px; line-height: 1.4;
    color: #26211A; text-align: justify; hyphens: auto; }
  .cm-bay p::first-letter { font-weight: 600; color: var(--ink); }

  /* ---- bottom row (four steel modules) ---- */
  .cm-botrow { display: grid; grid-template-columns: 1.18fr 1.08fr 1.06fr 1fr; gap: 11px; flex: none; height: 178px; margin-top: 11px; }
  .cm-module { position: relative; display: flex; flex-direction: column; padding: 7px 13px;
    background: linear-gradient(180deg,#1E1810,#120D07); border: 2px solid var(--steel-deep);
    box-shadow: inset 0 0 0 1px var(--steel-edge), inset 0 1px 0 #3a3020; }
  .cm-mhead { display: flex; align-items: center; gap: 8px; flex: none; margin-bottom: 8px; }
  .cm-mhead .t { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 12px;
    letter-spacing: .17em; text-transform: uppercase; color: var(--silver); }
  .cm-mhead .ln { flex: 1; height: 1px; background: var(--steel-edge); }
  .cm-mbody { flex: 1; min-height: 0; display: flex; }

  .cm-drow { display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    padding: 3.5px 0; border-bottom: 1px dotted #3A3122; }
  .cm-drow:last-child { border-bottom: 0; }
  .cm-drow .k { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 12px;
    letter-spacing: .1em; text-transform: uppercase; color: var(--silver-2); }
  .cm-drow .v { font-family: "Space Mono", monospace; font-weight: 700; font-size: 12px;
    color: #E7DCC4; text-align: right; line-height: 1.3; }
  .cm-drow .v.amber { color: var(--bulb); }
  .cm-site { display: flex; flex-direction: column; flex: 1; min-width: 0; }
  .cm-site-rows { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: space-between; }
  .cm-site .cm-drow { padding: 3px 0; }
  .cm-site .cm-drow .k { font-size: 12px; letter-spacing: .12em; }
  .cm-site .cm-drow .v { font-size: 16px; }

  /* weather grid */
  .cm-wxgrid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; flex: 1; }
  .cm-wx { display: flex; align-items: center; gap: 9px; }
  .cm-wx .ico { width: 23px; height: 23px; flex: none; stroke: var(--silver); fill: none; }
  .cm-wx .txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .cm-wx .val { font-family: "Space Mono", monospace; font-weight: 700; font-size: 14px; color: #EDE3CC; line-height: 1; }
  .cm-wx .lab { font-family: "Oswald", sans-serif; font-weight: 400; font-size: 12px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--silver-2); }

  .cm-field { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; min-height: 0; }
  .cm-fieldwrap { display: flex; align-items: center; justify-content: center; gap: 4px; flex: 1; min-height: 0; }
  .cm-battedsign { flex: none; height: 120px; width: auto; display: block; margin-top: -12px; }
  .cm-field svg { flex: none; min-height: 0; }
  .cm-field .cap { flex: none; font-family: "Oswald", sans-serif; font-weight: 500; font-size: 12px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--silver-2); margin-top: 2px; }
  .cm-field .cap b { color: var(--silver); font-weight: 600; }

  #root { min-height: 100vh; }

  /* Chrome's print rasterizer TILES large blurred box-shadows (both outer drop
     shadows and blurred INSET shadows) into dark rectangular seams — on this
     spread they merge into a "scrim" band across the top of the page. The
     seams are invisible on screen and appear only in the print/PDF raster.
     Fix: in print, strip every blurred shadow on the steel elements and keep
     only crisp 0-blur rings/borders, so the machined-steel look survives with
     no tiling artifacts. */
  @media print {
    .cm-rp {
      box-shadow: inset 0 0 0 2px var(--steel-edge), 0 0 0 1px #000 !important; }
    .cm-photopanel .bezel {
      box-shadow: inset 0 0 0 1px rgba(74,64,41,.6) !important; }
    .cm-ribbon, .cm-module, .cm-panel, .cm-nameplate,
    .cm-title-inner, .cm-pbody {
      box-shadow: none !important; }
    /* Anaheim technique: an outer blurred shadow DOES survive print cleanly when
       the element is promoted to its own composited layer — Chrome rasterizes
       the blur as one continuous layer instead of tiling it into seams. So keep
       these two shadows and promote them rather than stripping them. */
    .cm-firstvisit, .cm-board { transform: translateZ(0) !important; }
  }
</style>
