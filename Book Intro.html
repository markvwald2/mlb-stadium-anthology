<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jack's Ballparks — Introduction</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<script>
  (function () {
    function load() {
      if (!document.fonts || !document.fonts.load) return;
      ["400 1em \"League Gothic\"", "400 1em \"Newsreader\"", "500 1em \"Newsreader\"", "400 1em \"Space Mono\""]
        .forEach(function (f) { try { document.fonts.load(f); } catch (e) {} });
    }
    load();
    document.addEventListener("DOMContentLoaded", load);
  })();
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #2a2722;
    font-family: "Newsreader", Georgia, serif;
    color: #1b1916;
    -webkit-font-smoothing: antialiased;
  }

  /* ════════ DIRECTION B — COLLECTION / GALLERY ════════════════════ */
  .jc-page {
    position: relative;
    width: 1275px; height: 1088px;
    overflow: hidden;
    background: #e9e7db;
    color: #1b1916;
    letter-spacing: -0.5px;   /* mirror DesignCanvas .dc-card tracking so print == design */
    font-kerning: normal; text-rendering: geometricPrecision;
    --paper: #e9e7db; --ink: #16140f; --navy: #21303c; --rust: #9B3A2E;
    --mut: #6f6757; --rule: #c9bda3; --rule-soft: #d6ccb4;
  }
  .jc-inner { position: absolute; inset: 0; padding: 50px 48px 40px; display: flex; flex-direction: column; }

  /* headline-as-concept + deck */
  .jc-headline {
    font-family: "League Gothic", "Oswald", sans-serif; font-weight: 400;
    font-size: 81px; line-height: .92; letter-spacing: .004em; text-transform: uppercase;
    color: var(--navy); margin: 0; white-space: nowrap;
  }
  .jc-hl-dot { color: var(--rust); font-size: .58em; vertical-align: .2em; margin: 0 .2em; }
  .jc-deck {
    font-family: "Newsreader", Georgia, serif; font-weight: 400;
    font-size: 16px; line-height: 1.3; color: #28303a; margin: 12px 0 0;
    white-space: nowrap;
  }

  /* documentary photo mosaic — the hero element */
  .jc-mosaic {
    margin-top: 18px; flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: 1fr 1fr 0.93fr 0.93fr 1fr 1fr;
    gap: 9px;
  }
  .jc-tile { position: relative; background: #ded9c9; }
  .jc-tile:hover { z-index: 5; }
  .jc-tile image-slot { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* stadium eras — six-part classification key, complete rosters */
  .jc-gen { margin-top: 18px; flex: 0 0 auto; }
  .jc-gen-head { display: flex; align-items: center; gap: 18px; margin-bottom: 13px; }
  .jc-gen-rule { flex: 1 1 auto; height: 1px; background: var(--rule); }
  .jc-gen-title {
    font-family: "League Gothic", "Oswald", sans-serif; font-weight: 400;
    font-size: 21px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink);
  }
  .jc-gen-cols { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; }
  .jc-gen-col {
    min-width: 0; padding: 0 14px; border-right: 1px solid var(--rule-soft);
    display: flex; flex-direction: column;
  }
  .jc-gen-col:first-child { padding-left: 14px; }
  .jc-gen-col:last-child { border-right: 0; padding-right: 14px; }
  .jc-gen-era-top { min-height: 58px; }
  .jc-gen-era-name {
    font-family: "League Gothic", "Oswald", sans-serif; font-weight: 400;
    font-size: 18px; letter-spacing: .02em; text-transform: uppercase; line-height: 1.0;
  }
  .jc-gen-era-desc {
    font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 400;
    font-size: 11px; line-height: 1.28; color: var(--mut); margin-top: 5px;
  }
  .jc-gen-draw { width: 100%; height: 95px; margin: 9px 0 10px; display: flex; align-items: flex-end; justify-content: center; }
  .jc-gen-draw image-slot { --slot-frame-bg: transparent; }
  .jc-gen-draw image-slot { width: 100%; height: 100%; display: block; }
  .jc-gen-parks {
    margin: 0; padding-top: 9px; width: 100%;
    border-top: 1px solid var(--rule);
    font-family: "Newsreader", Georgia, serif; font-weight: 400;
    font-size: 11px; line-height: 1.5; letter-spacing: 0.1px; color: #2c2820;
  }

  #root { min-height: 100vh; }
  .dc-card { background: #e9e7db; }
</style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#e9e7db"/>
      <line x1="14" y1="52" x2="86" y2="52" stroke="#16140f" stroke-width="2.4"/>
      <circle cx="26" cy="52" r="4" fill="#9B3A2E"/>
      <circle cx="44" cy="52" r="4" fill="#2C4A6E"/>
      <circle cx="66" cy="52" r="4" fill="#6B672C"/>
      <circle cx="80" cy="52" r="4" fill="#B0792A"/>
      <path d="M50 30 L58 38 L50 46 L42 38 Z" fill="#21303c"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script src="jack-collection-data.js"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="print-page.jsx"></script>
  <script type="text/babel" src="jack-collection.jsx"></script>
  <script type="text/babel" src="jack-intro-app.jsx"></script>
</body>
</html>
