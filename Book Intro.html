<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jack's Ballparks — Introduction</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<script>
  (function () {
    function load() {
      if (!document.fonts || !document.fonts.load) return;
      ["400 1em \"League Gothic\"", "400 1em \"Newsreader\"", "500 1em \"Newsreader\"", "400 1em \"Space Mono\""]
        .forEach(function (f) { try { document.fonts.load(f); } catch (e) {} });
    }
    load();
    document.addEventListener("DOMContentLoaded", load);
  })();
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #2a2722;
    font-family: "Newsreader", Georgia, serif;
    color: #1b1916;
    -webkit-font-smoothing: antialiased;
  }

  /* ── PAGE SHELL ─────────────────────────────────────────────────── */
  .jb-page {
    position: relative;
    width: 1275px; height: 1088px;
    overflow: hidden;
    background: #e9e7db;
    color: #1b1916;
    font-kerning: normal;
    text-rendering: geometricPrecision;
    --paper: #e9e7db;
    --ink: #16140f;
    --navy: #21303c;
    --rust: #9B3A2E;
    --mut: #6f6757;
    --rule: #c9bda3;
    --rule-soft: #d6ccb4;
  }
  .jb-inner {
    position: absolute; inset: 0;
    padding: 34px 48px 26px;
    display: flex; flex-direction: column;
  }
  .jb-num { font-family: "League Gothic", "Oswald", sans-serif; font-weight: 400; }

  /* mono kicker */
  .jb-kicker {
    font-family: "Space Mono", monospace;
    font-size: 13px; letter-spacing: .26em; text-transform: uppercase;
    color: var(--navy); font-weight: 700;
  }

  /* ── MASTHEAD ───────────────────────────────────────────────────── */
  .jb-mast { display: flex; gap: 44px; align-items: flex-start; }
  .jb-mast-l { flex: 1 1 auto; min-width: 0; }
  .jb-mast-r { flex: 0 0 452px; padding-top: 4px; }

  .jb-title {
    font-family: "League Gothic", "Oswald", sans-serif;
    font-weight: 400;
    font-size: 110px; line-height: .82; letter-spacing: .012em;
    text-transform: uppercase;
    color: var(--navy);
    margin: 0;
  }
  .jb-subline {
    display: flex; align-items: baseline; gap: 14px;
    margin-top: 14px;
  }
  .jb-sub-item {
    font-size: 27px; letter-spacing: .05em; text-transform: uppercase;
    color: var(--rust); font-weight: 400;
  }
  .jb-subline .jb-dot { color: var(--rust); font-size: 15px; opacity: .8; }
  .jb-standfirst {
    font-family: "Newsreader", Georgia, serif;
    font-style: italic; font-weight: 400;
    font-size: 21px; line-height: 1.34;
    color: #2a261f;
    margin: 14px 0 0; max-width: 600px;
    text-wrap: pretty;
  }

  .jb-intro-p {
    font-family: "Newsreader", Georgia, serif;
    font-weight: 400;
    font-size: 14px; line-height: 1.5;
    color: #2c2820;
    margin: 0 0 9px;
    text-wrap: pretty;
  }
  .jb-intro-p:last-child { margin-bottom: 0; }

  /* ── TIMELINE ───────────────────────────────────────────────────── */
  .jb-tl { margin-top: 12px; }
  .jb-tl-stage { position: relative; height: 150px; margin-top: 14px; }

  .jb-axis { position: absolute; left: 0; right: 0; top: 24px; height: 2px; background: var(--ink); }
  .jb-tick { position: absolute; top: 24px; transform: translateX(-50%); }
  .jb-tick-label {
    position: absolute; bottom: 9px; left: 50%; transform: translateX(-50%);
    font-size: 15px; color: #9b917d; letter-spacing: .02em;
  }
  .jb-tick-mark {
    position: absolute; top: -3px; left: 50%; transform: translateX(-50%);
    width: 1px; height: 8px; background: #b3a98f;
  }
  .jb-mk {
    position: absolute; top: 25px; width: 11px; height: 11px;
    border-radius: 50%; transform: translate(-50%, -50%);
    border: 1.5px solid var(--paper);
    box-shadow: 0 0 0 1px rgba(0,0,0,.18);
  }

  .jb-leadsvg { position: absolute; left: 0; right: 0; top: 26px; height: 32px; width: 100%; overflow: visible; }

  .jb-labels { position: absolute; left: 0; right: 0; top: 60px; }
  .jb-lab {
    position: absolute; top: 0; transform: translateX(-50%);
    width: 90px; text-align: center;
    display: flex; flex-direction: column; align-items: center;
  }
  .jb-badge {
    width: 19px; height: 19px; border-radius: 50%;
    border: 1.5px solid; background: var(--paper);
    font-family: "Space Mono", monospace; font-weight: 700; font-size: 11px;
    display: flex; align-items: center; justify-content: center;
  }
  .jb-lab-year { font-size: 23px; line-height: 1; margin-top: 5px; }
  .jb-lab-region {
    margin-top: 4px;
    font-family: "League Gothic", "Oswald", sans-serif; font-weight: 400;
    font-size: 13.5px; line-height: 1.0; letter-spacing: .035em;
    text-transform: uppercase; color: #3a352c;
  }
  .jb-lab-line { display: block; }
  .jb-lab-stat {
    font-family: "Space Mono", monospace;
    font-size: 9px; letter-spacing: .03em; text-transform: uppercase;
    color: #8a8270; margin-top: 5px; line-height: 1;
  }

  /* ── MID BAND : COLLECTION + ERAS ──────────────────────────────── */
  .jb-midband { display: flex; gap: 20px; margin-top: 12px; align-items: stretch; }
  .jb-panel {
    border: 1.5px solid var(--ink);
    padding: 14px 20px 16px;
    display: flex; flex-direction: column;
  }
  .jb-collection { flex: 0 0 360px; }
  .jb-eras { flex: 1 1 auto; }
  .jb-panel-h {
    font-family: "Space Mono", monospace;
    font-size: 13px; letter-spacing: .2em; text-transform: uppercase;
    color: var(--ink); font-weight: 700;
    text-align: center;
    padding-bottom: 10px; margin-bottom: 13px;
    border-bottom: 1px solid var(--rule);
    position: relative;
  }
  .jb-panel-note {
    display: block; margin-top: 5px;
    font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 400;
    font-size: 12.5px; letter-spacing: .01em; text-transform: none;
    color: #9a7d4a;
  }

  /* collection stat grid */
  .jb-stats {
    flex: 1 1 auto;
    display: grid; grid-template-columns: repeat(3, 1fr);
    column-gap: 8px; row-gap: 14px;
    align-content: center;
  }
  .jb-stat { text-align: center; }
  .jb-stat-n { font-size: 60px; line-height: .86; }
  .jb-stat-sm { font-size: 42px; }
  .jb-stat-l {
    font-family: "Space Mono", monospace;
    font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--mut); margin-top: 8px;
  }
  .jb-stat-sub {
    font-family: "Newsreader", Georgia, serif; font-style: italic;
    font-size: 11px; color: #948a76; margin-top: 2px;
  }

  /* eras row */
  .jb-era-row { flex: 1 1 auto; display: flex; gap: 0; }
  .jb-era {
    flex: 1 1 0; padding: 0 16px;
    display: flex; flex-direction: column; align-items: center;
    border-right: 1px solid var(--rule-soft);
  }
  .jb-era:last-child { border-right: 0; }
  .jb-era-slot {
    width: 100%; height: 58px; margin-bottom: 9px;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .jb-era-slot image-slot { width: 100%; height: 100%; display: block; }
  .jb-era-bar { width: 100%; height: 7px; }
  .jb-era-name {
    font-family: "League Gothic", "Oswald", sans-serif; font-weight: 400;
    font-size: 15.5px; letter-spacing: .03em; text-transform: uppercase;
    color: var(--ink); margin-top: 10px; text-align: center; line-height: 1.0;
    min-height: 30px;
  }
  .jb-era-name-l { display: block; }
  .jb-era-years {
    font-size: 13px; color: var(--mut); margin-top: 2px;
  }
  .jb-era-count { font-size: 40px; line-height: 1; color: var(--ink); margin-top: 9px; }
  .jb-era-count-l {
    font-family: "Space Mono", monospace;
    font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--mut); margin-top: 6px;
  }

  /* ── EVOLUTION STRIP ───────────────────────────────────────────── */
  .jb-evo { margin-top: 12px; }
  .jb-evo-kicker {
    padding-bottom: 8px; border-bottom: 1px solid var(--rule); margin-bottom: 10px;
  }
  .jb-evo-row { display: flex; gap: 9px; }
  .jb-evo-cell { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; }
  .jb-evo-slot {
    width: 100%; height: 46px;
    display: flex; align-items: flex-end; justify-content: center;
  }
  .jb-evo-slot image-slot { width: 100%; height: 100%; display: block; }
  .jb-evo-name {
    font-family: "League Gothic", "Oswald", sans-serif; font-weight: 400;
    font-size: 13px; letter-spacing: .02em; text-transform: uppercase;
    color: var(--ink); margin-top: 7px; text-align: center; line-height: 1.0;
  }
  .jb-evo-year {
    font-size: 12px; color: var(--mut); margin-top: 3px;
  }

  /* ── FOOTER TAGLINE ────────────────────────────────────────────── */
  .jb-foot {
    margin-top: auto;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    padding-top: 12px; border-top: 1.5px solid var(--ink);
  }
  .jb-foot-t {
    font-family: "League Gothic", "Oswald", sans-serif; font-weight: 400;
    font-size: 20px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--navy);
  }
  .jb-foot-dia { color: var(--rust); font-size: 9px; }

  /* ════════ DIRECTION B — COLLECTION / GALLERY ════════════════════ */
  .jc-page {
    position: relative;
    width: 1275px; height: 1088px;
    overflow: hidden;
    background: #e9e7db;
    color: #1b1916;
    font-kerning: normal; text-rendering: geometricPrecision;
    --paper: #e9e7db; --ink: #16140f; --navy: #21303c; --rust: #9B3A2E;
    --mut: #6f6757; --rule: #c9bda3; --rule-soft: #d6ccb4;
  }
  .jc-inner { position: absolute; inset: 0; padding: 40px 48px 32px; display: flex; flex-direction: column; }

  /* headline-as-concept + deck */
  .jc-headline {
    font-family: "League Gothic", "Oswald", sans-serif; font-weight: 400;
    font-size: 81px; line-height: .92; letter-spacing: .004em; text-transform: uppercase;
    color: var(--navy); margin: 0; white-space: nowrap;
  }
  .jc-hl-dot { color: var(--rust); font-size: .58em; vertical-align: .2em; margin: 0 .2em; }
  .jc-deck {
    font-family: "Newsreader", Georgia, serif; font-weight: 400;
    font-size: 16px; line-height: 1.3; color: #28303a; margin: 12px 0 0;
    white-space: nowrap;
  }

  /* documentary photo mosaic — the hero element */
  .jc-mosaic {
    margin-top: 18px; height: 552px;
    display: grid; grid-template-columns: repeat(12, 1fr); grid-template-rows: repeat(5, 1fr);
    gap: 9px;
  }
  .jc-tile { position: relative; overflow: hidden; background: #ded9c9; }
  .jc-tile image-slot { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* generations of the game — five-part classification key */
  .jc-gen { margin-top: 16px; }
  .jc-gen-head { display: flex; align-items: center; gap: 18px; margin-bottom: 14px; }
  .jc-gen-rule { flex: 1 1 auto; height: 1px; background: var(--rule); }
  .jc-gen-title {
    font-family: "League Gothic", "Oswald", sans-serif; font-weight: 400;
    font-size: 21px; letter-spacing: .2em; text-transform: uppercase; color: var(--ink);
  }
  .jc-gen-cols { display: grid; grid-template-columns: repeat(6, 1fr); gap: 0; }
  .jc-gen-col {
    flex: 1 1 0; min-width: 0; padding: 0 13px; border-right: 1px solid var(--rule-soft);
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .jc-gen-col:first-child { padding-left: 0; }
  .jc-gen-col:last-child { border-right: 0; padding-right: 0; }
  .jc-gen-era-name {
    font-family: "League Gothic", "Oswald", sans-serif; font-weight: 400;
    font-size: 18px; letter-spacing: .02em; text-transform: uppercase; line-height: 1.0;
    min-height: 34px; display: flex; align-items: center;
  }
  .jc-gen-era-desc {
    font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 400;
    font-size: 11px; line-height: 1.3; color: var(--mut); margin-top: 6px; text-wrap: pretty;
  }
  .jc-gen-draw { width: 100%; height: 76px; margin: 11px 0 9px; display: flex; align-items: flex-end; justify-content: center; }
  .jc-gen-draw image-slot { width: 100%; height: 100%; display: block; }
  .jc-gen-parks {
    width: 100%;
    font-family: "League Gothic", "Oswald", sans-serif; font-weight: 400;
    font-size: 10.5px; letter-spacing: .03em; text-transform: uppercase; color: #2a2620; line-height: 1.5;
  }
  .jc-gen-sep { color: var(--rust); margin: 0 .3em; }
  .jc-gen-park { white-space: nowrap; }
  .jc-gen-more {
    font-family: "Newsreader", Georgia, serif; font-style: italic; font-weight: 400;
    text-transform: none; letter-spacing: 0; color: var(--mut); font-size: 11px; white-space: nowrap;
  }

  #root { min-height: 100vh; }
  .dc-card { background: #e9e7db; }
</style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#e9e7db"/>
      <line x1="14" y1="52" x2="86" y2="52" stroke="#16140f" stroke-width="2.4"/>
      <circle cx="26" cy="52" r="4" fill="#9B3A2E"/>
      <circle cx="44" cy="52" r="4" fill="#2C4A6E"/>
      <circle cx="66" cy="52" r="4" fill="#6B672C"/>
      <circle cx="80" cy="52" r="4" fill="#B0792A"/>
      <path d="M50 30 L58 38 L50 46 L42 38 Z" fill="#21303c"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script src="jack-intro-data.js"></script>
  <script src="jack-collection-data.js"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="print-page.jsx"></script>
  <script type="text/babel" src="jack-intro.jsx"></script>
  <script type="text/babel" src="jack-collection.jsx"></script>
  <script type="text/babel" src="jack-intro-app.jsx"></script>
</body>
</html>
