<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mile High Stadium — Spread</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Graduate&family=Oswald:wght@300;400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #100f12;
    font-family: "Spectral", Georgia, serif;
    color: #232021;
    -webkit-font-smoothing: antialiased;
  }

  /* ----------------------------------------------------------------
     MILE HIGH STADIUM — "Proof of Concept / The Borrowed Bowl"
     Blurb Large Landscape 13 × 11 in, two-page spread.
     2550 × 1088 px (25.50 × 10.88 in @ 100ppi). Export 3x = 7650 × 3264 px = 300 DPI.
     Center split x=1275. Bleed-only outer 12.5px; critical content >= 37.5px inside trim.
     Concrete + steel editorial survey; Rockies purple/black/silver as restrained accents.
     ---------------------------------------------------------------- */
  .mh-spread {
    position: relative;
    width: 2550px; height: 1088px;
    overflow: hidden;
    --ink: #232021;
    --ink-2: #54504A;
    --ink-3: #8A857B;
    --paper: #EBE6DA;
    --paper-hi: #F2ECDF;
    --paper-lo: #DFD7C5;
    --rule: #D2C8B2;
    --rule-strong: #B2A88E;
    --purple: #5A3E8E;
    --purple-deep: #3C2A63;
    --purple-hi: #7A5DB0;
    --silver: #9DA0A4;
    --steel: #5C5E62;
    background: var(--paper);
    font-kerning: normal;
    text-rendering: geometricPrecision;
    /* Mirror the DesignCanvas artboard card's inherited tracking so the PDF/print
       path (which has no card) lays out identically. Without this, untracked
       Spectral text (prose, facts values, ribbon, scorecard) renders wider in
       print, wraps to extra lines, grows the right page and shoves the visit
       section off the bottom. Elements with explicit tracking override this. */
    letter-spacing: -0.5px;
  }

  .mh-page { position: absolute; top: 0; height: 1088px; }
  .mh-left  { left: 0; width: 1275px; overflow: hidden; background: #16161a; }
  .mh-right { left: 1275px; width: 1275px; background: var(--paper); }

  /* ---------- LEFT / HERO ---------- */
  .mh-hero-slot { position: absolute; inset: 0; width: 1275px; height: 1088px; z-index: 1; }
  .mh-hero-slot image-slot { width: 1275px; height: 1088px; display: block; }
  .mh-hero-scrim {
    position: absolute; inset: 0; pointer-events: none; z-index: 2; z-index: 3;
    background: linear-gradient(180deg, rgba(238,233,222,.72) 0%, rgba(238,233,222,.28) 12%, rgba(238,233,222,0) 24%);
  }
  @media print {
    /* Skia print-to-PDF: image-slot <img> transform makes its own composited
       layer that paints over a plain sibling scrim regardless of z-index.
       Composite the slot too so the img layer stays contained below the scrim. */
    .mh-hero-slot  { transform: translateZ(0) !important; }
    .mh-hero-scrim { transform: translateZ(0) !important; }
  }


  /* ── top masthead: title + elevation, purple on the pale sky ── */
  .mh-topmast {
    position: absolute; left: 0; right: 0; top: 0; z-index: 6;
    padding: 44px 76px 0; display: flex; justify-content: space-between; align-items: flex-start;
  }
  .mh-topmast-r { display: flex; flex-direction: column; align-items: flex-end; text-align: right; }
  .mh-topmast .mh-elev-cap { font-family: "Space Mono", monospace; font-weight: 700; text-transform: uppercase; letter-spacing: .22em; font-size: 13px; color: var(--purple); }
  .mh-topmast .mh-elev { display: flex; align-items: baseline; gap: 10px; margin-top: 8px; }
  .mh-topmast .mh-elev .ev { font-family: "Bebas Neue", sans-serif; font-size: 92px; line-height: .78; color: var(--purple-deep); letter-spacing: .01em; }
  .mh-topmast .mh-elev .eu { font-family: "Space Mono", monospace; font-weight: 700; font-size: 22px; color: var(--purple); letter-spacing: .08em; }

  .mh-hero-name { margin: 0; font-family: "Graduate", "Oswald", sans-serif; font-weight: 700; color: var(--purple-deep); line-height: .92; letter-spacing: .01em; text-transform: uppercase; }
  .mh-hero-name span { display: block; white-space: nowrap; }
  .mh-hero-name span:first-child { font-size: 90px; }
  .mh-hero-name span:last-child { font-size: 90px; color: var(--purple); }

  /* ── decreased bottom band: location + marks + era/coord ── */
  .mh-plate {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; height: 150px;
    padding: 22px 76px 40px; display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(180deg, rgba(60,42,99,.8) 0%, rgba(36,26,61,.8) 100%);
    border-top: 3px solid var(--purple-hi);
  }
  .mh-plate-l { display: flex; flex-direction: column; gap: 14px; }
  .mh-plate-r { display: flex; flex-direction: column; align-items: flex-end; gap: 9px; text-align: right; }
  .mh-hero-loc { font-family: "Oswald", sans-serif; font-weight: 500; white-space: nowrap; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; color: #E7DDC8; }
  .mh-hero-era { display: flex; align-items: center; gap: 14px; white-space: nowrap; font-family: "Oswald", sans-serif; font-weight: 500; font-size: 15px; letter-spacing: .13em; text-transform: uppercase; color: #C8BEAC; }
  .mh-hero-era .dot { color: #9A7FD0; font-size: 18px; font-weight: 700; }
  .mh-plate .mh-coord { font-family: "Space Mono", monospace; font-size: 14px; letter-spacing: .04em; color: #C7BEDA; }

  .mh-hero-marks { display: flex; align-items: center; gap: 18px; }
  .mh-hero-marks .nl { height: 36px; width: auto; display: block; }
  .mh-hero-marks .div { width: 1px; height: 30px; background: rgba(232,226,214,.32); }
  .mh-hero-marks .mlb { height: 26px; width: auto; display: block; }

  /* ---------- RIGHT PAGE SHELL ---------- */
  .mh-rp { position: absolute; inset: 0; padding: 38px 46px 36px 64px; display: flex; flex-direction: column; }
  .mh-section { display: flex; flex-direction: column; }
  .mh-stadium { flex: 0 0 auto; }
  .mh-visit { flex: 0 0 auto; margin-top: auto; }

  /* section header — roman index + eyebrow on a heavy rule */
  .mh-sec-h { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 5px; margin-bottom: 8px; }
  .mh-sec-h .ix { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 13px; letter-spacing: .04em; color: #F3ECDB; background: var(--purple); padding: 2px 9px; align-self: center; }
  .mh-sec-h .tt { font-family: "Oswald", sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .13em; font-size: 16px; color: var(--ink); }
  .mh-sec-h .nt { margin-left: auto; font-family: "Space Mono", monospace; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }

  /* ---------- IDENTITY RIBBON ---------- */
  .mh-ribbon { display: flex; align-items: stretch; border-top: 2.5px solid var(--ink); border-bottom: 2.5px solid var(--ink); }
  .mh-ribbon .cell { flex: 1; padding: 7px 15px; border-left: 1px solid var(--rule); display: flex; flex-direction: column; gap: 5px; justify-content: center; }
  .mh-ribbon .cell:first-child { border-left: 0; }
  .mh-ribbon .rl { font-family: "Oswald", sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-3); font-size: 12px; }
  .mh-ribbon .rv { font-family: "Spectral", serif; font-weight: 600; font-size: 15.5px; color: var(--ink); line-height: 1.06; }
  .mh-ribbon .mark-cell { flex: 0 0 auto; align-items: center; justify-content: center; padding: 8px 18px; }
  .mh-ribbon .mark-cell .rib-mark { height: 44px; width: auto; display: block; }
  .mh-ribbon .colors-cell { flex: 0 0 auto; }
  .mh-ribbon .colors-cell .sw-row { display: flex; gap: 10px; }
  .mh-ribbon .sw { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .mh-ribbon .sw .chip { width: 17px; height: 17px; border-radius: 2px; border: 1px solid rgba(0,0,0,.25); display: block; }
  .mh-ribbon .sw .cn { font-family: "Oswald", sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; font-size: 12px; color: var(--ink-3); }
  .mh-ribbon .visit-cell { flex: 0 0 auto; align-items: flex-end; justify-content: center; background: var(--purple); padding: 9px 20px; gap: 2px; }
  .mh-ribbon .visit-cell .vn { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 12px; letter-spacing: .18em; color: #D8C9F0; text-transform: uppercase; line-height: 1; }
  .mh-ribbon .visit-cell .vv { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 23px; letter-spacing: .03em; color: #F3ECDB; text-transform: uppercase; line-height: 1; white-space: nowrap; }

  /* ---------- STADIUM BODY: facts + diagram/finance ---------- */
  .mh-body { display: grid; grid-template-columns: 1fr 270px 282px; gap: 22px; margin-top: 8px; align-items: stretch; }

  .mh-facts { border: 1px solid var(--rule-strong); display: flex; flex-direction: column; align-self: stretch; }
  .mh-facts .row { display: grid; grid-template-columns: 128px 1fr; border-bottom: 1px solid var(--rule); flex: 1; }
  .mh-facts .row:last-child { border-bottom: 0; }
  .mh-facts .row .fl { font-family: "Oswald", sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); font-size: 12px; padding: 3px 11px; border-right: 1px solid var(--rule); background: var(--paper-lo); display: flex; align-items: center; }
  .mh-facts .row .fv { font-family: "Spectral", serif; font-weight: 500; color: var(--ink); font-size: 12px; line-height: 1.2; padding: 3px 12px; display: flex; align-items: center; letter-spacing: -0.6px; }

  .mh-side { display: flex; flex-direction: column; gap: 10px; }

  /* two stacked archival photo plates between the facts table and the field/finance column */
  .mh-photos { display: flex; flex-direction: column; gap: 10px; align-self: stretch; }
  .mh-photo { margin: 0; flex: 1; display: flex; flex-direction: column; border: 1px solid var(--rule-strong); background: var(--paper-hi); padding: 6px 6px 4px; min-height: 0; }
  .mh-photo image-slot { display: block; width: 100%; flex: 1 1 auto; min-height: 96px; }
  .mh-fieldfig { margin: 0; border: 1px solid var(--rule-strong); background: var(--paper-hi); padding: 6px 6px 4px; }
  .mh-fieldwrap { width: 100%; max-width: 187px; margin: 0 auto; }
  .mh-fieldfig figcaption { text-align: center; font-family: "Space Mono", monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-top: 2px; }
  .mh-finance { border-top: 1.5px solid var(--ink); padding-top: 8px; }
  .mh-finance .fin-h { font-family: "Oswald", sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; font-size: 12px; color: var(--purple); margin-bottom: 5px; }
  .mh-finance .fin-cost { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; }
  .mh-finance .fin-cost .fc-v { font-family: "Anton", sans-serif; font-size: 25px; color: var(--ink); line-height: .9; }
  .mh-finance .fin-cost .fc-adj { font-family: "Space Mono", monospace; font-size: 12px; color: var(--ink-3); }
  .mh-finance .fin-v { font-family: "Spectral", serif; font-weight: 500; font-size: 12px; color: var(--ink); line-height: 1.36; margin: 0; text-align: justify; hyphens: auto; }

  /* ---------- TENANCY TIMELINE ---------- */
  .mh-timeline { margin-top: 8px; border-top: 1.5px solid var(--ink); padding-top: 6px; }
  .mh-timeline .tl-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; }
  .mh-timeline .tl-t { font-family: "Oswald", sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; font-size: 12px; color: var(--purple); }
  .mh-timeline .tl-s { font-family: "Spectral", serif; font-style: italic; font-size: 12px; color: var(--ink-2); }
  .mh-timeline .tl-track { position: relative; display: grid; grid-template-columns: repeat(8, 1fr); }
  .mh-timeline .tl-line { position: absolute; top: 5px; left: 6.25%; right: 6.25%; height: 2px; background: var(--rule-strong); z-index: 0; }
  .mh-timeline .tl-span { position: absolute; top: 4px; left: 56.25%; width: 12.5%; height: 4px; background: var(--purple); z-index: 1; }
  .mh-timeline .tl-node { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .mh-timeline .tl-dot { width: 11px; height: 11px; border-radius: 50%; background: var(--paper); border: 2px solid var(--rule-strong); }
  .mh-timeline .tl-node.mlb .tl-dot { background: var(--purple); border-color: var(--purple); }
  .mh-timeline .tl-yr { font-family: "Anton", sans-serif; font-size: 20px; color: var(--ink); margin-top: 6px; line-height: .9; }
  .mh-timeline .tl-node.mlb .tl-yr { color: var(--purple); }
  .mh-timeline .tl-cap { font-family: "Oswald", sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; font-size: 12px; color: var(--ink-3); margin-top: 4px; line-height: 1.22; max-width: 130px; }
  .mh-timeline .tl-node.mlb .tl-cap { color: var(--ink-2); }

  /* ---------- CONTEXT PROSE ---------- */
  .mh-ctx { columns: 2; column-gap: 24px; column-rule: 1px solid var(--rule); margin-top: 8px; }
  .mh-ctx p { margin: 0 0 5px; font-family: "Spectral", serif; font-size: 12.5px; line-height: 1.42; color: var(--ink); text-align: justify; hyphens: auto; }
  .mh-ctx p:last-child { margin-bottom: 0; }
  .mh-ctx .mh-dropcap {
    float: left; font-family: "Anton", sans-serif; font-weight: 400; color: var(--purple);
    font-size: 46px; line-height: .72; margin: 3px 7px 0 0; text-transform: uppercase;
  }

  /* Print/design parity: the design page mounts this spread inside a DesignCanvas
     artboard whose card carries an inherited `letter-spacing: -0.5px`; the PDF
     harness has no card. The fix is the single root-level `letter-spacing: -0.5px`
     on `.mh-spread` above, applied in BOTH contexts, so every untracked Spectral
     element wraps identically (design page unchanged — it already had -0.5px).
     (Superseded the old print-only `body.pp-mode` -0.4px patch, which was
     approximate and only covered the prose + finance value.) */

  /* ---------- VISIT SUMMARY STRIP ---------- */
  .mh-vstrip { display: flex; border-top: 2px solid var(--ink); border-bottom: 2px solid var(--ink); }
  .mh-vstrip .vs-cell { flex: 1; padding: 6px 16px; border-left: 1px solid var(--rule); display: flex; flex-direction: column; gap: 3px; }
  .mh-vstrip .vs-cell:first-child { border-left: 0; }
  .mh-vstrip .vs-l { font-family: "Oswald", sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-3); font-size: 12px; }
  .mh-vstrip .vs-v { font-family: "Spectral", serif; font-weight: 600; font-size: 15.5px; color: var(--ink); line-height: 1.05; }

  /* ---------- VISIT BODY: line score (left) + single photo plate (right) ---------- */
  .mh-vbody { display: grid; grid-template-columns: 1fr 282px; gap: 22px; margin-top: 6px; align-items: stretch; }
  .mh-vbody .mh-vmain { display: flex; flex-direction: column; }
  .mh-vbody .mh-vmain .mh-scorecard { margin-top: 0; }
  .mh-vbody .mh-vmain .mh-weather { margin-top: 6px; }
  .mh-vphoto { align-self: stretch; }

  /* ---------- SCORECARD ---------- */
  .mh-scorecard { border: 1.5px solid var(--ink); background: var(--paper-hi); padding: 7px 18px 8px; margin-top: 6px; }
  .mh-scorecard .sc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 1px solid var(--rule); padding-bottom: 6px; margin-bottom: 5px; }
  .mh-scorecard .sc-match { font-family: "Oswald", sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 15px; color: var(--ink); }
  .mh-scorecard .sc-result { display: flex; align-items: baseline; gap: 13px; white-space: nowrap; }
  .mh-scorecard .sc-result .rs { font-family: "Spectral", serif; font-weight: 700; font-size: 16px; color: var(--purple); }
  .mh-scorecard .sc-result .fn { font-family: "Space Mono", monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  .mh-scorecard .sc-facts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px 18px; padding-top: 6px; border-top: 1px solid var(--rule); margin-top: 6px; }
  .mh-scorecard .scf-l { font-family: "Oswald", sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; color: var(--ink-3); }
  .mh-scorecard .scf-v { font-family: "Spectral", serif; font-weight: 600; font-size: 14px; color: var(--ink); margin-top: 2px; line-height: 1.1; }
  .mh-scorecard .scf-n { display: block; font-family: "Space Mono", monospace; font-weight: 400; font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); margin-top: 1px; }

  /* line score */
  .mh-scoreboard { width: 100%; border-collapse: collapse; font-family: "Space Mono", monospace; table-layout: fixed; }
  .mh-scoreboard th, .mh-scoreboard td { text-align: center; border-bottom: 1px solid var(--rule); padding: 2px 0; color: var(--ink); }
  .mh-scoreboard thead th { color: var(--ink-3); font-weight: 400; font-size: 12px; padding-bottom: 3px; }
  .mh-scoreboard .inn { font-size: 13px; }
  .mh-scoreboard tbody td.inn { color: var(--ink-2); }
  .mh-scoreboard td.tm, .mh-scoreboard th.tm { text-align: left; font-family: "Oswald", sans-serif; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: 15px; color: var(--ink); width: 70px; padding-left: 2px; }
  .mh-scoreboard .sep { border-left: 1.5px solid var(--ink); }
  .mh-scoreboard .hecol { font-size: 13px; font-weight: 700; width: 32px; }
  .mh-scoreboard thead th.sep, .mh-scoreboard thead th { width: 32px; }
  .mh-scoreboard .rcol { font-family: "Anton", sans-serif; font-weight: 400; font-size: 21px; line-height: .85; width: 44px; color: var(--ink); }
  .mh-scoreboard tbody tr:last-child td { border-bottom: 0; }
  .mh-scoreboard tbody tr.win td.tm { color: var(--purple); }
  .mh-scoreboard tbody tr.win .rcol { color: var(--purple); }

  /* ---------- WEATHER ---------- */
  .mh-weather { display: flex; align-items: stretch; border: 1.5px solid var(--ink); margin-top: 6px; }
  .mh-weather .wlabel { font-family: "Oswald", sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .2em; font-size: 12px; color: #F3ECDB; background: var(--purple); display: flex; align-items: center; padding: 0 18px; }
  .mh-weather .witem { flex: 1; display: flex; align-items: center; gap: 11px; padding: 6px 18px; border-left: 1px solid var(--rule); white-space: nowrap; }
  .mh-weather .witem:first-of-type { border-left: 0; }
  .mh-weather .witem .ico { flex: 0 0 auto; }
  .mh-weather .witem b { font-family: "Spectral", serif; font-weight: 700; font-size: 19px; color: var(--ink); line-height: 1; }
  .mh-weather .witem .t { font-family: "Oswald", sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: .08em; font-size: 13px; color: var(--ink-2); }
  .mh-weather .witem .k { font-family: "Oswald", sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: .1em; font-size: 12px; color: var(--ink-3); margin-right: 3px; }

  /* field diagram */
  .fd-wrap { width: 100%; }
  .fd-svg { width: 100%; height: auto; display: block;  overflow: visible; }

  #root { min-height: 100vh; }
</style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#EBE6DA"/>
      <path d="M26 64 L40 44 L60 44 L74 64 Z" fill="none" stroke="#232021" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M34 64 L46 47 L54 47 L66 64" fill="none" stroke="#5A3E8E" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M20 70 L80 70" stroke="#5A3E8E" stroke-width="2.6"/>
      <circle cx="50" cy="30" r="3" fill="#5A3E8E"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script src="milehigh-data.js"></script>
  <script src="field-labels.js"></script>
  <script src="weather-icons.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="milehigh-protractor.jsx"></script>
