<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Big League NL · AL Ballparks — Book Layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Ultra&display=swap" rel="stylesheet" />
<style>
  @font-face {
    font-family: "Cooper Black";
    src: url("../Cooper-Black.woff2") format("woff2");
    font-weight: 400 900;
    font-style: normal;
    font-display: swap;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #11100e;
    font-family: "Spectral", Georgia, serif;
    color: #1b1916;
    -webkit-font-smoothing: antialiased;
  }
  #root {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 34px 18px 54px;
  }
  .cv-index {
    width: min(1420px, 100%);
    background: #e9e7db;
    --paper: #e9e7db;
    --paper-hi: #f1efe6;
    --ink: #16140f;
    --cap: #1b1916;
    --cap-city: #3f3a31;
    --rule: #d3c8af;
    --muted: #655d4d;
    font-kerning: normal;
    text-rendering: geometricPrecision;
  }
  .cv-index-head {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 36px 46px 24px;
  }
  .cv-index-head::before,
  .cv-index-head::after {
    content: "";
    position: absolute;
    top: 136px;
    height: 2px;
    background: var(--rule);
    box-shadow: 0 5px 0 rgba(22, 20, 15, .08);
  }
  .cv-index-head::before {
    left: 46px;
    right: calc(50% + 190px);
  }
  .cv-index-head::after {
    left: calc(50% + 190px);
    right: 46px;
  }
  .cv-logo {
    font-family: "Cooper Black", "Ultra", Georgia, serif;
    color: var(--ink);
    text-align: center;
    line-height: .9;
    user-select: none;
  }
  .cv-logo-l1,
  .cv-logo-l3 {
    font-size: clamp(44px, 5.1vw, 68px);
    letter-spacing: .002em;
    white-space: nowrap;
  }
  .cv-logo-l2 {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-size: clamp(30px, 3.3vw, 44px);
    margin: 3px 0;
  }
  .cv-fieldicon {
    width: clamp(30px, 3.1vw, 42px);
    height: clamp(30px, 3.1vw, 42px);
    position: relative;
    top: 3px;
  }
  .cv-sub {
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .11em;
    color: #4a4439;
    text-align: center;
    font-size: 13px;
    margin-top: 12px;
  }
  .layout-wrap {
    padding: 0 46px 46px;
  }
  .layout-head {
    border-top: 2px solid var(--rule);
    padding-top: 18px;
    margin-bottom: 10px;
    color: var(--muted);
    font: 700 12px/1 "Spectral", Georgia, serif;
    letter-spacing: .11em;
    text-transform: uppercase;
  }
  .layout-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
  }
  .layout-spread {
    min-width: 0;
    position: relative;
    padding-top: 27px;
  }
  .row-number {
    position: absolute;
    top: 0;
    left: 0;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    color: var(--muted);
    font: 700 12px/1 "Spectral", Georgia, serif;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .spread-pair {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0;
  }
  .spread-pair .page-slot:first-child {
    border-right: 0;
  }
  .page-slot {
    min-width: 0;
    border: 1px solid rgba(22, 20, 15, .18);
    background:
      linear-gradient(135deg, rgba(255, 255, 255, .24), rgba(22, 20, 15, 0) 52%),
      #ddd7c8;
    color: inherit;
    text-decoration: none;
    outline: 0;
    position: relative;
  }
  .page-slot:focus-visible {
    box-shadow: 0 0 0 3px #e9e7db, 0 0 0 6px #16140f;
    z-index: 3;
  }
  .page-slot.blank {
    background:
      repeating-linear-gradient(-45deg, rgba(22, 20, 15, .045) 0 1px, transparent 1px 9px),
      rgba(241, 239, 230, .46);
    border-style: dashed;
  }
  .page-slot.blank .page-art {
    opacity: .42;
  }
  .page-label {
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    border-bottom: 1px solid rgba(22, 20, 15, .14);
    color: var(--muted);
    font: 700 10px/1 "Spectral", Georgia, serif;
    letter-spacing: .09em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .page-art {
    aspect-ratio: 1275 / 1088;
    position: relative;
    overflow: hidden;
    background: #eee9db;
  }
  .page-art.wide {
    aspect-ratio: 2550 / 1088;
  }
  .page-art.jacket {
    aspect-ratio: 2668.1 / 1162.5;
  }
  .page-art img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
  }
  .page-art img.is-missing {
    display: none;
  }
  .page-title {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    text-align: center;
    font: 700 clamp(18px, 2.1vw, 30px)/1.02 "Cooper Black", "Ultra", Georgia, serif;
    color: rgba(22, 20, 15, .82);
  }
  .page-meta {
    min-height: 44px;
    display: grid;
    align-content: center;
    gap: 2px;
    padding: 8px 10px 9px;
    border-top: 1px solid rgba(22, 20, 15, .14);
    text-align: center;
  }
  .page-name {
    font: 700 13px/1.05 "Spectral", Georgia, serif;
    color: var(--cap);
  }
  .page-kind {
    font: 700 10px/1 "Spectral", Georgia, serif;
    letter-spacing: .09em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .spread-card {
    min-width: 0;
    display: block;
    color: inherit;
    text-decoration: none;
    outline: 0;
    border: 1px solid rgba(22, 20, 15, .18);
    background:
      linear-gradient(135deg, rgba(255, 255, 255, .24), rgba(22, 20, 15, 0) 52%),
      #ddd7c8;
  }
  .spread-card:focus-visible {
    box-shadow: 0 0 0 3px #e9e7db, 0 0 0 6px #16140f;
    z-index: 3;
  }
  .spread-labels {
    height: 26px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    border-bottom: 1px solid rgba(22, 20, 15, .14);
    color: var(--muted);
    font: 700 10px/1 "Spectral", Georgia, serif;
    letter-spacing: .09em;
    text-transform: uppercase;
  }
  .spread-labels span {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 10px;
    min-width: 0;
    white-space: nowrap;
  }
  .spread-labels span + span {
    border-left: 1px solid rgba(22, 20, 15, .14);
  }
  .cv-foot {
    padding: 0 46px 38px;
    font: 700 12px/1.25 "Spectral", Georgia, serif;
    color: #5b5447;
    text-align: center;
    letter-spacing: .04em;
    text-transform: uppercase;
  }
  @media (max-width: 760px) {
    #root { padding: 0; }
    .cv-index { width: 100%; }
    .cv-index-head {
      padding: 28px 18px 18px;
    }
    .cv-index-head::before,
    .cv-index-head::after { display: none; }
    .layout-wrap { padding: 0 14px 32px; }
    .layout-head {
      font-size: 10px;
    }
    .layout-grid {
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .layout-spread {
      padding-top: 22px;
    }
    .page-label,
    .spread-labels {
      height: 26px;
      font-size: 9px;
      letter-spacing: .06em;
    }
    .page-meta { min-height: 44px; padding: 7px 6px; }
    .page-name { font-size: 12px; }
    .page-kind { font-size: 9px; }
    .cv-foot { padding: 0 18px 28px; font-size: 10px; }
  }
</style>
</head>
<body>
  <div id="root">
    <main class="cv-index" aria-label="Big League book layout">
      <header class="cv-index-head">
        <div></div>
        <div>
          <div class="cv-logo" aria-label="Big League NL AL Ballparks">
            <div class="cv-logo-l1">Big League</div>
            <div class="cv-logo-l2">
              <span>NL</span>
              <svg class="cv-fieldicon" viewBox="0 0 84 84" aria-hidden="true">
                <g fill="none" stroke="#16140f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M42 70 L16 44 M42 70 L68 44"/>
                  <path d="M16 44 A38 38 0 0 1 68 44"/>
                </g>
                <path d="M42 42 L56 56 L42 70 L28 56 Z" fill="#4a5a69" stroke="#16140f" stroke-width="4" stroke-linejoin="round"/>
                <circle cx="42" cy="56" r="3" fill="#e9e7db"/>
              </svg>
              <span>AL</span>
            </div>
            <div class="cv-logo-l3">Ballparks</div>
          </div>
          <div class="cv-sub">Book layout</div>
        </div>
        <div></div>
      </header>

      <section class="layout-wrap" aria-label="Book page sequence">
        <div class="layout-head" aria-hidden="true">
          Two-column spread board
        </div>
        <div id="book-layout" class="layout-grid"></div>
      </section>
      <footer class="cv-foot">Click any thumbnail to open its local page</footer>
    </main>
  </div>

  <script>
    const ROOT = "../";
    const CACHE_VERSION = new URLSearchParams(location.search).get("v") || "df21f7c";

    function escAttr(value) {
      return String(value).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
    }

    function escHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function thumbSlug(page) {
      return page.toLowerCase()
        .replace(/\.html$/, "")
        .replace(/&/g, "and")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-|-$/g, "");
    }

    function spreadThumb(page) {
      return "assets/page-thumbnails/" + thumbSlug(page) + ".jpg";
    }

    function itemThumb(item) {
      return item.thumb || spreadThumb(item.page);
    }

    function versioned(path) {
      const sep = path.includes("?") ? "&" : "?";
      return path + sep + "v=" + encodeURIComponent(CACHE_VERSION);
    }

    function pageHref(page) {
      return ROOT + encodeURI(page);
    }

    function missingImageHandler() {
      return "this.classList.add('is-missing');";
    }

    function singlePageSlot(item, side) {
      if (!item) {
        return `
          <div class="page-slot blank" aria-label="Blank ${side} page">
            <div class="page-label">Blank</div>
            <div class="page-art"><div class="page-title">Blank</div></div>
            <div class="page-meta">
              <div class="page-name">No page</div>
              <div class="page-kind">${escHTML(side)} side</div>
            </div>
          </div>`;
      }
      if (!item.page) {
        return `
          <div class="page-slot" aria-label="${escAttr(item.title)}">
            <div class="page-label">${escHTML(item.label || side)}</div>
            <div class="page-art">
              <div class="page-title">${escHTML(item.title)}</div>
            </div>
            <div class="page-meta">
              <div class="page-name">${escHTML(item.title)}</div>
              <div class="page-kind">${escHTML(item.kind || "Page")}</div>
            </div>
          </div>`;
      }
      return `
        <a class="page-slot" href="${pageHref(item.page)}" target="_blank" rel="noopener noreferrer" title="Open ${escAttr(item.title)}">
          <div class="page-label">${escHTML(item.label)}</div>
          <div class="page-art">
            <div class="page-title">${escHTML(item.title)}</div>
            <img src="${escAttr(versioned(item.thumb))}" alt="${escAttr(item.title)} thumbnail" onerror="${missingImageHandler()}">
          </div>
          <div class="page-meta">
            <div class="page-name">${escHTML(item.title)}</div>
            <div class="page-kind">${escHTML(item.kind || "Page")}</div>
          </div>
        </a>`;
    }

    function pagePairCard(left, right) {
      return `
        <div class="spread-pair">
          ${singlePageSlot(left, "left")}
          ${singlePageSlot(right, "right")}
        </div>`;
    }

    function spreadCard(item) {
      const labels = item.leftLabel && item.rightLabel
        ? [item.leftLabel, item.rightLabel]
        : ["Page " + item.leftPage, "Page " + item.rightPage];
      const artClass = item.artClass || "wide";
      return `
        <a class="spread-card" href="${pageHref(item.page)}" target="_blank" rel="noopener noreferrer" title="Open ${escAttr(item.title)}">
          <div class="spread-labels">
            <span>${escHTML(labels[0])}</span>
            <span>${escHTML(labels[1])}</span>
          </div>
          <div class="page-art ${escAttr(artClass)}">
            <div class="page-title">${escHTML(item.title)}</div>
            <img src="${escAttr(versioned(itemThumb(item)))}" alt="${escAttr(item.title)} thumbnail" onerror="${missingImageHandler()}">
          </div>
          <div class="page-meta">
            <div class="page-name">${escHTML(item.title)}</div>
            <div class="page-kind">${escHTML(item.kind || "Two-page spread")}</div>
          </div>
        </a>`;
    }

    function maxPageValue(item) {
      if (!item) return 0;
      return Math.max(
        Number.isFinite(item.leftPage) ? item.leftPage : 0,
        Number.isFinite(item.rightPage) ? item.rightPage : 0
      );
    }

    function buildLayout(items) {
      const rows = [];
      let nextPage = 1;

      items.forEach((entry) => {
        if (entry.include === false) return;

        if (entry.type === "cover") {
          rows.push({
            kind: "cover",
            item: {
              ...entry,
              thumb: itemThumb(entry),
              artClass: "jacket",
              leftLabel: entry.leftLabel || "Back cover",
              rightLabel: entry.rightLabel || "Spine + front cover",
              kind: entry.kind || "Cover wrap"
            }
          });
          return;
        }

        if ("left" in entry || "right" in entry) {
          const left = entry.left ? { ...entry.left } : null;
          const right = entry.right ? { ...entry.right } : null;
          if (left && !Number.isFinite(left.leftPage) && !Number.isFinite(left.rightPage)) {
            left.leftPage = nextPage;
            left.label = left.label || "Page " + nextPage;
          }
          if (right && !Number.isFinite(right.leftPage) && !Number.isFinite(right.rightPage)) {
            right.rightPage = nextPage + (left ? 1 : 0);
            right.label = right.label || "Page " + right.rightPage;
          }
          rows.push({
            kind: "pair",
            left: left,
            right: right
          });
          nextPage = Math.max(nextPage, Math.max(maxPageValue(left), maxPageValue(right)) + 1);
          return;
        }

        const item = { ...entry, thumb: itemThumb(entry) };
        const autoAssignedPages = !Number.isFinite(item.leftPage) && !Number.isFinite(item.rightPage);
        if (autoAssignedPages) {
          item.leftPage = nextPage;
          item.rightPage = nextPage + 1;
        }
        if (!item.leftLabel && Number.isFinite(item.leftPage)) item.leftLabel = "Page " + item.leftPage;
        if (!item.rightLabel && Number.isFinite(item.rightPage)) item.rightLabel = "Page " + item.rightPage;

        rows.push({
          kind: "spread",
          item: { ...item, kind: item.kind || "Two-page spread" }
        });
        nextPage = autoAssignedPages ? item.rightPage + 1 : Math.max(nextPage, maxPageValue(item) + 1);
      });

      return rows;
    }

    function renderLayout(rows) {
      document.getElementById("book-layout").innerHTML = rows.map((row, index) => {
        const rowNumber = String(index + 1).padStart(2, "0");
        const content = row.kind === "cover"
          ? spreadCard(row.item)
          : row.kind === "pair"
          ? pagePairCard(row.left, row.right)
          : spreadCard(row.item);
        return `
          <div class="layout-spread">
            <div class="row-number">Spread ${rowNumber}</div>
            ${content}
          </div>`;
      }).join("");
    }

    fetch(versioned("book-order.json"), { cache: "reload" })
      .then(r => r.json())
      .then(items => renderLayout(buildLayout(items)))
      .catch(err => {
        document.getElementById("book-layout").innerHTML =
          `<p style="padding:20px;font-weight:700;">Could not load visualization/book-order.json: ${escHTML(err.message)}</p>`;
      });
  </script>
</body>
</html>
