<!doctype html><html><head><meta charset="utf-8"><title>Weather icon system — review</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F3EFE6;color:#26241F;font-family:"Spectral",serif;padding:44px 54px 80px}
h1{font-family:"Oswald",sans-serif;font-weight:600;font-size:22px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 6px}
.sub{font-size:14px;color:#6B6357;margin:0 0 34px;max-width:70ch}
h2{font-family:"Oswald",sans-serif;font-weight:600;font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:#7A7061;border-bottom:1px solid #CFC6B4;padding-bottom:7px;margin:38px 0 20px}
.row{display:flex;flex-wrap:wrap;gap:26px}
.cell{display:flex;flex-direction:column;align-items:center;gap:9px;width:118px;padding:16px 6px;border:1px solid #DCD3C1;background:#FBF8F1}
.cell .nm{font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6B6357}
.sizes{display:flex;align-items:flex-end;gap:30px;flex-wrap:wrap}
.sz{display:flex;flex-direction:column;align-items:center;gap:7px}
.sz .n{font-family:"Oswald",sans-serif;font-size:10.5px;letter-spacing:.1em;color:#8A8172}
table{border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 18px 7px 0;border-bottom:1px solid #E2DACA;vertical-align:middle}
th{font-family:"Oswald",sans-serif;font-weight:600;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#7A7061}
.dark{background:#1E2124;border-color:#3A3E42}
.dark .nm{color:#9A9384}
.swatches{display:flex;gap:24px;flex-wrap:wrap}
</style></head><body>
<h1>Weather icon system</h1>
<p class="sub">One 24×24 stroke set, shared by every spread via <code>weather-icons.js</code>. Each spread keeps its own box size, stroke color, and stroke weight — only the geometry is unified.</p>

<h2>The set</h2>
<div class="row" id="set"></div>

<h2>At the sizes used across spreads</h2>
<div class="sizes" id="sizes"></div>

<h2>On dark hero panels</h2>
<div class="row" id="dark"></div>

<h2>Condition mapping</h2>
<table id="map"><thead><tr><th>Source value</th><th>Icon</th><th>Kind</th></tr></thead><tbody></tbody></table>

<script src="weather-icons.js"></script>
<script>
const K = WxIcons.KINDS;
const svg = (k, size, stroke, sw) => '<svg width="'+size+'" height="'+size+'" viewBox="0 0 24 24" fill="none" stroke="'+stroke+'" stroke-width="'+(sw||1.4)+'" stroke-linecap="round" stroke-linejoin="round">'+WxIcons.markup(k)+'</svg>';
document.getElementById('set').innerHTML = K.map(k=>'<div class="cell">'+svg(k,40,'#3C372E',1.3)+'<div class="nm">'+k+'</div></div>').join('');
document.getElementById('sizes').innerHTML = [18,20,22,24,26,28,30,34,38].map(s=>'<div class="sz"><div>'+K.map(k=>svg(k,s,'#3C372E',1.4)).join(' ')+'</div><div class="n">'+s+' px</div></div>').join('');
document.getElementById('dark').innerHTML = K.map(k=>'<div class="cell dark">'+svg(k,40,'#E7E0D0',1.3)+'<div class="nm">'+k+'</div></div>').join('');
const rows = ["Clear","Mostly Clear","Sunny","Partly Cloudy","Partly Cloudy; Mostly Clear","Cloudy","Overcast","Drizzle","Light Drizzle","Rain","Temperature","Wind","Humidity"];
document.querySelector('#map tbody').innerHTML = rows.map(r=>{const k=WxIcons.resolve(r);return '<tr><td>'+r+'</td><td>'+svg(k,24,'#3C372E',1.4)+'</td><td>'+k+'</td></tr>';}).join('');
</script>
</body></html>
