<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Royals Stadium — Spread</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500;600;700&family=Spectral:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #2b2b2e;
    font-family: "Spectral", Georgia, serif;
    color: #1C2630;
    -webkit-font-smoothing: antialiased;
  }

  /* ----------------------------------------------------------------
     SPREAD CANVAS — Blurb Large Landscape 13 x 11 in, two-page spread.
     2550 x 1088 px (25.50in x 10.88in @ 100ppi). Export at 3x = 7650 x 3264 px = 300 DPI.
     Center split x=1275. Trim 12.5px in from each edge; bleed-only outer 12.5px.
     Safety: critical content >= 37.5px from any trim edge; gutter safe zone x=1237.5-1312.5.
     Royals Stadium — 1973 modernist baseball-only park; fountains + crown.
     ---------------------------------------------------------------- */
  .rs-spread {
    position: relative;
    width: 2550px; height: 1088px;
    overflow: hidden;
    /* royal-blue + gold modernist system (swap to retheme) */
    --ink: #1C2630;
    --ink-2: #51606E;
    --ink-3: #8A93A0;
    --paper: #EFE8D7;          /* clean modernist cream */
    --paper-hi: #F6F1E4;
    --paper-lo: #E2D8C2;
    --rule: #D6CCB4;
    --rule-strong: #B3A684;
    --royal: #134A8E;          /* Royals primary — royal blue */
    --royal-deep: #0C2F5C;
    --royal-ink: #0A2547;
    --gold: #BD9B60;           /* Royals secondary — gold */
    --gold-hi: #D2B477;
    --gold-deep: #9A7C44;
    --navy: #0E2E58;           /* dark data panel + footer */
    --navy-2: #08203F;
    --panel-ink: #EDE6D5;
    --panel-dim: #93A9C6;
    background: var(--paper);
    font-kerning: normal;
    text-rendering: geometricPrecision;
  }

  /* pages */
  .rs-page { position: absolute; top: 0; height: 1088px; }
  .rs-left  { left: 0; width: 1275px; overflow: hidden;
    background: linear-gradient(176deg, #16407A 0%, #0E2E58 46%, #081E3B 100%); }
  .rs-right { left: 1275px; width: 1275px; background: var(--paper); }
  .rs-gutter {
    display: none;
  }

  /* ---------- LEFT / HERO ---------- */
  .rs-hero-slot { position: absolute; inset: 0; width: 1275px; height: 1088px; z-index: 1; }
  .rs-hero-slot image-slot { width: 1275px; height: 1088px; display: block; }
  .rs-hero-scrim {
    position: absolute; inset: 0; pointer-events: none; z-index: 3;
    background:
      linear-gradient(180deg, rgba(8,22,44,.46) 0%, rgba(8,22,44,0) 26%),
      linear-gradient(0deg, rgba(6,18,38,.90) 0%, rgba(6,18,38,.52) 24%, rgba(6,18,38,0) 50%);
  }
  /* the famous outfield fountains — a fine cascade motif along the right edge */
  .rs-fountains { position: absolute; top: 0; right: 0; width: 360px; height: 1088px; z-index: 2; opacity: .5; pointer-events: none; }
  /* crown emblem, upper-left */
  .rs-crown { position: absolute; left: 80px; top: 60px; z-index: 6; width: auto; height: 132px; display: block; }
  .rs-folio {
    position: absolute; left: 80px; top: 210px; z-index: 6;
    font-family: "Space Mono", monospace; font-size: 16px; letter-spacing: .3em;
    color: rgba(225,233,245,.62); text-transform: uppercase;
  }
  .rs-hero-title { position: absolute; left: 76px; bottom: 96px; z-index: 6; }
  .rs-hero-name {
    margin: 0; font-family: "Anton", sans-serif; font-weight: 400;
    color: #F1E8D3; font-size: 178px; line-height: .82; letter-spacing: .004em;
    text-transform: uppercase; text-shadow: 0 3px 40px rgba(0,0,0,.5);
  }
  .rs-hero-name .l2 { display: block; color: #E7D6B6; }
  .rs-hero-banner {
    display: inline-flex; align-items: center; gap: 16px; margin-top: 28px;
  }
  .rs-hero-banner .tag {
    background: var(--gold); color: #1A2230;
    font-family: "Oswald", sans-serif; font-weight: 600;
    font-size: 27px; letter-spacing: .26em; text-transform: uppercase;
    padding: 8px 20px; line-height: 1; white-space: nowrap;
  }
  .rs-hero-banner .yrs {
    font-family: "Space Mono", monospace; font-size: 19px; letter-spacing: .24em;
    color: #C7D2E2;
  }
  .rs-hero-era {
    position: absolute; left: 80px; bottom: 56px; z-index: 6;
    font-family: "Oswald", sans-serif; font-weight: 500; font-size: 16px;
    letter-spacing: .22em; text-transform: uppercase; color: #93A9C6;
  }

  /* ---------- RIGHT PAGE SHELL ---------- */
  .rs-rp { position: absolute; inset: 0; padding: 44px 45px 92px 50px; display: flex; flex-direction: column; gap: 13px; }
  .rs-body-grid { display: grid; grid-template-columns: 338px 360px 1fr; gap: 22px; align-items: start; flex: 0 0 auto; }
  .rs-col { display: flex; flex-direction: column; gap: 11px; min-width: 0; }
  .rs-body-grid > .rs-col:first-child { justify-content: flex-start; }
  .rs-card { display: flex; flex-direction: column; }
  .rs-essay-full { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  /* shared label / value type */
  .rs-lbl {
    font-family: "Oswald", sans-serif; font-weight: 500;
    text-transform: uppercase; letter-spacing: .13em; color: var(--ink-3);
    font-size: 10.5px;
  }
  .rs-val { font-family: "Spectral", serif; font-weight: 500; color: var(--ink); font-size: 13px; line-height: 1.28; }
  .rs-mono { font-family: "Space Mono", monospace; }

  /* section header — royal index chip + gold rule */
  .rs-sec-h { display: flex; align-items: center; gap: 10px; border-bottom: 1.5px solid var(--royal); padding-bottom: 6px; margin-bottom: 6px; }
  .rs-sec-h .ix {
    font-family: "Space Mono", monospace; font-size: 11px; font-weight: 700;
    color: #fff; background: var(--royal); letter-spacing: .02em;
    padding: 2px 6px; line-height: 1;
  }
  .rs-sec-h .tt { font-family: "Oswald", sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .15em; font-size: 17px; color: var(--ink); }
  .rs-sec-h .rule-fill { flex: 1; height: 3px; align-self: center;
    background: linear-gradient(90deg, var(--gold) 0 22px, transparent 22px);
    background-size: 28px 3px; }

  /* ---------- IMAGE STRIP ---------- */
  .rs-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; flex: 1 1 auto; min-height: 110px; }
  .rs-strip image-slot { width: 100%; height: 100%; min-height: 110px; display: block; border: 1px solid var(--rule-strong); }

  /* ---------- SPEC RIBBON ---------- */
  .rs-ribbon { border-top: 3px solid var(--royal); border-bottom: 3px solid var(--royal); display: flex; position: relative; }
  .rs-ribbon::after { content: ""; position: absolute; left: 0; right: 0; bottom: -6px; height: 1.5px; background: var(--gold); }
  .rs-ribbon .cell { flex: 1; padding: 11px 12px 12px; border-left: 1px solid var(--rule); display: flex; flex-direction: column; gap: 5px; justify-content: center; }
  .rs-ribbon .cell:first-child { border-left: 0; }
  .rs-ribbon .cell .rs-lbl { font-size: 9px; letter-spacing: .14em; }
  .rs-ribbon .cell .rv { font-family: "Spectral", serif; font-weight: 600; font-size: 15px; color: var(--ink); line-height: 1.05; }
  .rs-ribbon .team-cell, .rs-ribbon .league-cell { flex-direction: row; align-items: center; justify-content: flex-start; gap: 11px; }
  .rs-ribbon .team-cell image-slot { width: 42px; height: 42px; display: block; flex: none; }
  .rs-ribbon .team-cell .team-logo { height: 46px; width: auto; display: block; flex: none; }
  .rs-ribbon .league-cell .league-logo { height: 50px; width: auto; display: block; flex: none; }
  .rs-ribbon .team-cell .tx, .rs-ribbon .league-cell .tx { display: flex; flex-direction: column; gap: 4px; }

  /* ---------- LEDGER ---------- */
  .rs-ledger { display: flex; flex-direction: column; }
  .rs-ledger .row { display: grid; grid-template-columns: 84px 1fr; gap: 12px; padding: 1px 0; border-bottom: 1px solid var(--rule); align-items: baseline; }
  .rs-ledger .row:last-child { border-bottom: 0; }
  .rs-ledger .row .rs-lbl { padding-top: 0; }
  .rs-ledger .row .rs-val { font-size: 11px; line-height: 1.24; }

  /* ---------- NAMING / LINEAGE ---------- */
  .rs-stack { margin-bottom: 9px; }
  .rs-stack:last-child { margin-bottom: 0; }
  .rs-stack .k { margin-bottom: 4px; }
  .rs-stack .v { font-size: 12px; line-height: 1.36; }

  /* ---------- FIELD DIAGRAM (reuses window.FieldDiagram .fd-* classes) ---------- */
  .fd-wrap { width: 100%; max-width: 152px; margin: 0 auto; }
  .rs-fieldcard { flex: 0 0 auto; }
  .rs-ctxcard { flex: 1 1 auto; }
  /* inline field-plan figure floated into the context prose */
  .rs-fieldfig { float: right; width: 150px; margin: 3px 0 8px 16px; }
  .rs-fieldfig .fd-wrap { max-width: 150px; margin: 0; }
  .rs-fieldfig figcaption { font-family: "Space Mono", monospace; font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); text-align: center; margin-top: 5px; line-height: 1.35; }
  /* context flow (L-shape: lead under field plan, continued under visit) */
  .rs-ctx p { margin: 0 0 7px; font-family: "Spectral", serif; font-size: 14px; line-height: 1.28; color: var(--ink); text-align: justify; hyphens: auto; }
  .rs-ctx p:last-child { margin-bottom: 0; }
  /* col-2 lead prose: open the leading so it bottom-aligns with col-3 continued prose */
  .rs-ctx-lead p { line-height: 1.397; }
  .rs-ctx-lead p:first-of-type::first-letter { font-family: "Anton", sans-serif; font-weight: 400; font-size: 40px; line-height: .82; float: left; padding: 3px 7px 0 0; color: var(--royal); }
  .rs-ctxcont { margin-top: 0; }
  .rs-ctx-eyebrow { font-family: "Oswald", sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .15em; font-size: 11px; color: var(--gold-deep); margin-bottom: 8px; }
  .fd-svg { width: 100%; height: auto; display: block; }
  .fd-dist { font-family: "Space Mono", monospace; font-size: 13px; fill: #F4EEE0; font-weight: 700; paint-order: stroke; stroke: rgba(0,0,0,.35); stroke-width: 2.5px; }
  .fd-compass-n { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 14px; fill: var(--royal); }
  .fd-caption { display: flex; justify-content: space-between; margin-top: 6px; font-family: "Space Mono", monospace; font-size: 9px; letter-spacing: .1em; color: var(--ink-3); text-transform: uppercase; }

  /* ---------- TIMELINE ---------- */
  .rs-tl { position: relative; }
  .rs-tl .track { position: absolute; left: 5px; right: 5px; top: 5px; height: 2px; background: var(--rule-strong); }
  .rs-tl .pts { display: flex; position: relative; }
  .rs-tl .pt { flex: 1; text-align: left; padding-right: 8px; }
  .rs-tl .pt .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--paper); border: 2.5px solid var(--royal); margin-bottom: 10px; position: relative; z-index: 1; }
  .rs-tl .pt.accent .dot { background: var(--gold); border-color: var(--gold-deep); }
  .rs-tl .pt .yr { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 16px; color: var(--ink); letter-spacing: .02em; }
  .rs-tl .pt .ev { font-family: "Spectral", serif; font-size: 11px; color: var(--ink-2); line-height: 1.25; margin-top: 2px; }
  .rs-reno { margin-top: 11px; display: grid; grid-template-columns: 92px 1fr; gap: 10px; border-top: 1px solid var(--rule); padding-top: 9px; }
  .rs-reno .v { font-family: "Spectral", serif; font-style: italic; font-size: 11px; color: var(--ink-2); line-height: 1.4; }

  /* ---------- VISIT PANEL (dark royal) ---------- */
  .rs-visit { background: linear-gradient(168deg, var(--navy) 0%, var(--navy-2) 100%); color: var(--panel-ink); padding: 16px 18px 18px; position: relative; flex: 0 0 auto; display: flex; flex-direction: column; }
  .rs-visit::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 3px; background: var(--gold); }
  .rs-visit .vhead { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,.18); padding-bottom: 9px; margin-bottom: 12px; }
  .rs-visit .vhead .tt { font-family: "Oswald", sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .16em; font-size: 16px; color: #fff; }
  .rs-visit .pill { font-family: "Space Mono", monospace; font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: #08203F; background: var(--gold); padding: 3px 8px; }
  .rs-visit .vlbl { font-family: "Oswald", sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: .12em; color: var(--panel-dim); font-size: 10px; }
  .rs-visit .vval { font-family: "Spectral", serif; font-weight: 500; color: #F1EBDB; font-size: 12.5px; }

  .rs-vcols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
  .rs-vrow { display: grid; grid-template-columns: 84px 1fr; gap: 8px; padding: 3.5px 0; align-items: baseline; }

  .rs-matchup { flex: 1; display: flex; align-items: center; justify-content: center; gap: 18px; margin: 8px 0; }
  .rs-matchup .mlogo { height: 66px; width: auto; flex: none; display: block; }
  .rs-matchup .tm { text-align: center; }
  .rs-matchup .tm .abbr { font-family: "Oswald", sans-serif; font-weight: 600; font-size: 15px; letter-spacing: .08em; color: #fff; }
  .rs-matchup .tm .sc { font-family: "Anton", sans-serif; font-weight: 400; font-size: 78px; line-height: .86; color: #fff; }
  .rs-matchup .tm .sc.win { color: var(--gold-hi); }
  .rs-matchup .at { font-family: "Space Mono", monospace; font-size: 12px; color: var(--panel-dim); letter-spacing: .1em; }

  /* box score */
  .rs-box { width: 100%; border-collapse: collapse; font-family: "Space Mono", monospace; margin: 2px 0 4px; }
  .rs-box th, .rs-box td { text-align: center; font-size: 11px; padding: 3px 0; color: #E6DFCF; border-bottom: 1px solid rgba(255,255,255,.1); }
  .rs-box thead th { color: var(--panel-dim); font-weight: 400; font-size: 10px; }
  .rs-box td.tm, .rs-box th.tm { text-align: left; font-family: "Oswald", sans-serif; font-weight: 600; letter-spacing: .06em; color: #fff; font-size: 12px; padding-right: 6px; }
  .rs-box .rhe { font-weight: 700; color: #fff; }
  .rs-box .rcol { color: var(--gold-hi); font-weight: 700; }
  .rs-box .sep { border-left: 1px solid rgba(255,255,255,.22); }

  /* weather */
  .rs-wx { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid rgba(255,255,255,.2); margin-top: 12px; }
  .rs-wx .c { padding: 9px 6px 8px; text-align: center; border-left: 1px solid rgba(255,255,255,.16); }
  .rs-wx .c:first-child { border-left: 0; }
  .rs-wx .c .big { font-family: "Spectral", serif; font-weight: 700; font-size: 19px; color: #fff; line-height: 1; }
  .rs-wx .c .small { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 11px; color: #EFE9D8; line-height: 1.05; margin-top: 2px; }
  .rs-wx .c .cap { font-family: "Space Mono", monospace; font-size: 8px; letter-spacing: .1em; color: var(--panel-dim); text-transform: uppercase; margin-top: 5px; }
  .rs-wx .ico { display: block; margin: 0 auto 5px; }

  /* ---------- ESSAY ---------- */
  .rs-essay-body { column-count: 3; column-gap: 20px; column-rule: 1px solid var(--rule); }
  .rs-essay-body p { margin: 0 0 6px; font-family: "Spectral", serif; font-size: 12.5px; line-height: 1.42; color: var(--ink); text-align: justify; hyphens: auto; }
  .rs-essay-body p:first-child::first-letter {
    font-family: "Anton", sans-serif; font-weight: 400; font-size: 40px; line-height: .82; float: left;
    padding: 3px 7px 0 0; color: var(--royal);
  }

  /* ---------- FOOTER ---------- */
  .rs-footer { position: absolute; left: 0; right: 0; bottom: 0; height: 82px; background: linear-gradient(180deg, var(--navy) 0%, var(--navy-2) 100%); display: flex; align-items: flex-start; padding: 0 0 0 50px; }
  .rs-footer::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--gold); }
  .rs-footer .fl { display: flex; flex-direction: column; gap: 3px; padding-top: 9px; }
  .rs-footer .fl .plate { font-family: "Space Mono", monospace; font-size: 12px; line-height: 1.1; letter-spacing: .2em; color: #fff; }
  .rs-footer .fl .sub { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 12px; line-height: 1.1; letter-spacing: .14em; text-transform: uppercase; color: var(--panel-dim); }
  .rs-footer .colors { display: flex; gap: 16px; margin-left: 52px; }
  .rs-footer .colors .sw { display: flex; align-items: center; gap: 8px; }
  .rs-footer .colors .chip { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); }
  .rs-footer .colors .nm { font-family: "Oswald", sans-serif; font-weight: 500; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: #E7E1D0; }
  .rs-footer .status { margin-left: auto; align-self: stretch; background: var(--royal); display: flex; flex-direction: column; justify-content: flex-start; padding: 10px 45px 0 30px; }
  .rs-footer .status .k { font-family: "Space Mono", monospace; font-size: 9px; line-height: 1.1; letter-spacing: .2em; color: rgba(255,255,255,.8); }
  .rs-footer .status .v { font-family: "Oswald", sans-serif; font-weight: 700; font-size: 19px; line-height: 1.05; letter-spacing: .08em; text-transform: uppercase; color: #fff; }

  #root { min-height: 100vh; }
</style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect width="100" height="100" fill="#134A8E"/>

      <rect x="28" y="64" width="44" height="7" fill="#BD9B60"/>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script src="royals-data.js"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="protractor-diagram.jsx"></script>
  <script type="text/babel" src="print-page.jsx"></script>

</body>
